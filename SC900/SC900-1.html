<style>
:root{--blue:#2563eb;--bg:#f4f6fa;--line:#dce3ed;--text:#172033;--muted:#64748b;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
body{font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:var(--bg);margin:0;color:var(--text)}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:5}
.head{max-width:1000px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.brand{font-size:18px;font-weight:900;flex:1}
.progressTxt{font-weight:800;color:#475569}
main{max-width:1000px;margin:auto;padding:20px 16px 50px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:14px;box-shadow:0 8px 22px #1e293b0b}
h1{margin-top:0}
.note{background:#eef5ff;border-left:4px solid var(--blue);padding:13px;line-height:1.7}
.stats{color:var(--muted);line-height:1.7}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;font-size:15px}
.primary{background:var(--blue);color:#fff}
.secondary{background:#e8edf5;color:#263247}
.categoryBtns button.active{background:#dbeafe;color:#1d4ed8;outline:2px solid #93c5fd}
.qhead{display:flex;align-items:center;gap:10px}
.badge{font-size:13px;font-weight:800;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 9px}
.question{font-size:21px;font-weight:800;line-height:1.6;margin:18px 0}
.option{border:2px solid var(--line);border-radius:12px;padding:13px 14px;margin:9px 0;cursor:pointer;display:flex;gap:10px}
.option:hover{background:#f8fafc}
.option.selected{border-color:var(--blue);background:#eff6ff}
.option.correct{border-color:#22c55e;background:#ecfdf5}
.option.wrong{border-color:#ef4444;background:#fef2f2}
.letter{font-weight:900;min-width:24px}
.feedback{padding:14px;border-radius:11px;margin-top:15px;line-height:1.7}
.feedback.good{background:#ecfdf5}
.feedback.bad{background:#fef2f2}
.key{margin-top:8px;font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:18px 0}
.nav{padding:7px 0;font-size:11px;background:#edf1f6}
.nav.done{background:#dbeafe}
.nav.wrong{background:#fee2e2}
.hidden{display:none}
.score{font-size:58px;font-weight:950;color:var(--blue)}
.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.searchResults{margin-top:10px;max-height:380px;overflow:auto}
.searchItem{border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer;line-height:1.5}
.searchItem:hover{background:#f8fafc}
.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.question{font-size:19px}.grid{grid-template-columns:repeat(10,1fr)}.nav{font-size:9px;padding:6px 0}}
</style>
</head>

<div class="buttons categoryBtns">

<button onclick="startCategory('Purview / 合規')">Purview / 合規</button>

<h3>搜尋題目</h3>
<input id="search" class="search" placeholder="例如：PIM、DLP、Sentinel、Session control…" oninput="doSearch()">
<div id="searchResults" class="searchResults"></div>
</section>

<section id="quiz" class="card hidden">
<div class="qhead"><b id="num"></b><span id="cat" class="badge"></span></div>
<div id="question" class="question"></div>
<div id="options"></div>
<div id="feedback" class="hidden"></div>
<div class="row">
<button class="secondary" onclick="prevQ()">上一題</button>

<button id="nextBtn" class="primary hidden" onclick="nextQ()">下一題</button>
</div>
<div id="grid" class="grid"></div>
<button class="secondary" onclick="goHome()">回首頁</button>
</section>

<section id="result" class="card hidden"></section>
</main>

let session=[], idx=0, answers=[], locked=[], wrongFlags=[];

function shuffle(arr){
  let a=[...arr];
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function prepare(items){
  session=items.map(x=>JSON.parse(JSON.stringify(x)));
  // Shuffle answer choices each session and recalculate correct index.
  session.forEach(x=>{
    let pairs=x.opts.map((v,i)=>({v,i}));
    pairs=shuffle(pairs);
    x.opts=pairs.map(p=>p.v);
    x.ans=pairs.findIndex(p=>p.i===x.ans);
  });
  idx=0;answers=Array(session.length).fill(null);locked=Array(session.length).fill(false);wrongFlags=Array(session.length).fill(false);
  home.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');
  render();
}

function startAll(){prepare(BANK)}
function startRandom40(){prepare(shuffle(BANK).slice(0,Math.min(40,BANK.length)))}
function startCategory(c){prepare(BANK.filter(x=>x.cat===c))}
function startWrongOnly(){
  let ids=JSON.parse(localStorage.getItem('sc900_wrong_ids')||'[]');
  let items=ids.map(i=>BANK[i]).filter(Boolean);
  if(!items.length){alert('目前沒有儲存的錯題紀錄。先做一輪題目吧！');return}
  prepare(items);
}

function render(){
  let x=session[idx];
  progressTxt.textContent=(idx+1)+' / '+session.length;
  num.textContent='第 '+(idx+1)+' / '+session.length+' 題';
  cat.textContent=x.cat;
  question.textContent=x.q;
  options.innerHTML='';
  x.opts.forEach((v,j)=>{
    let d=document.createElement('div');
    let cls='option'+(answers[idx]===j?' selected':'');
    if(locked[idx]&&j===x.ans) cls+=' correct';
    if(locked[idx]&&answers[idx]===j&&j!==x.ans) cls+=' wrong';
    d.className=cls;
    d.innerHTML='<span class="letter">'+String.fromCharCode(65+j)+'.</span><span>'+v+'</span>';
    d.onclick=()=>{if(locked[idx])return;answers[idx]=j;render()};
    options.appendChild(d);
  });
  checkBtn.classList.toggle('hidden',locked[idx]);
  nextBtn.classList.toggle('hidden',!locked[idx]);
  feedback.className='hidden';
  feedback.innerHTML='';
  if(locked[idx]) showFeedback();
  drawGrid();
}

function checkAnswer(){
  if(answers[idx]===null){alert('請先選擇答案');return}
  locked[idx]=true;
  wrongFlags[idx]=answers[idx]!==session[idx].ans;
  render();
}

function showFeedback(){
  let x=session[idx], ok=!wrongFlags[idx];
  feedback.className='feedback '+(ok?'good':'bad');
  let ans=String.fromCharCode(65+x.ans)+'. '+x.opts[x.ans];
  feedback.innerHTML='<b>'+(ok?'✅ 答對':'❌ 答錯｜正確答案：'+ans)+'</b>'+
    (x.exp?'<div style="margin-top:8px">'+x.exp+'</div>':'')+
    (x.key?'<div class="key">記憶關鍵：'+x.key+'</div>':'');
}

function nextQ(){if(idx<session.length-1){idx++;render()}else finish()}
function prevQ(){if(idx>0){idx--;render()}}

function drawGrid(){
  grid.innerHTML='';
  session.forEach((_,j)=>{
    let b=document.createElement('button');
    b.className='nav '+(locked[j]?'done ':'')+(wrongFlags[j]?'wrong':'');
    b.textContent=j+1;
    b.onclick=()=>{idx=j;render()};
    grid.appendChild(b);
  });
}

function finish(){
  let score=session.reduce((n,x,j)=>n+(answers[j]===x.ans),0);
  // Save wrong questions by matching question text back to BANK.
  let wrongIds=[];
  session.forEach((x,j)=>{
    if(answers[j]!==x.ans){
      let id=BANK.findIndex(b=>b.q===x.q);
      if(id>=0) wrongIds.push(id);
    }
  });
  localStorage.setItem('sc900_wrong_ids',JSON.stringify(wrongIds));
  quiz.classList.add('hidden');result.classList.remove('hidden');
  progressTxt.textContent='完成';
  result.innerHTML='<h1>完成</h1><div class="score">'+score+' / '+session.length+'</div>'+
    '<h2>正確率 '+Math.round(score/session.length*100)+'%</h2>'+
    '<p>錯題共 '+wrongIds.length+' 題，已儲存在瀏覽器中，可回首頁按「複習上次錯題」。</p>'+
    '<div class="buttons"><button class="primary" onclick="goHome()">回首頁</button><button class="secondary" onclick="prepare(session)">再做一次本組</button></div>';
}

function goHome(){
  quiz.classList.add('hidden');result.classList.add('hidden');home.classList.remove('hidden');
  progressTxt.textContent=BANK.length+' 題';
}

function doSearch(){
  let s=search.value.trim().toLowerCase();
  if(!s){searchResults.innerHTML='';return}
  let rows=BANK.map((x,i)=>({x,i})).filter(o=>
    (o.x.q+' '+o.x.opts.join(' ')+' '+(o.x.exp||'')+' '+(o.x.key||'')).toLowerCase().includes(s)
  ).slice(0,30);
  searchResults.innerHTML=rows.length?rows.map(o=>
    '<div class="searchItem" onclick="openOne('+o.i+')"><b>'+o.x.cat+'</b><br>'+o.x.q+'<div class="small">點一下單題練習</div></div>'
  ).join(''):'<div class="small">找不到符合的題目</div>';
}

function openOne(i){prepare([BANK[i]])}
</script>
</body>
</html>
