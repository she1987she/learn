<style>
:root{--blue:#2563eb;--bg:#f4f6fa;--line:#dce3ed;--text:#172033;--muted:#64748b;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
body{font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:var(--bg);margin:0;color:var(--text)}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:5}
.head{max-width:1000px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.brand{font-size:18px;font-weight:900;flex:1}
.progressTxt{font-weight:800;color:#475569}
main{max-width:1000px;margin:auto;padding:20px 16px 50px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:14px;box-shadow:0 8px 22px #1e293b0b}
h1{margin-top:0}
.note{background:#eef5ff;border-left:4px solid var(--blue);padding:13px;line-height:1.7}
.stats{color:var(--muted);line-height:1.7}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;font-size:15px}
.primary{background:var(--blue);color:#fff}
.secondary{background:#e8edf5;color:#263247}
.categoryBtns button.active{background:#dbeafe;color:#1d4ed8;outline:2px solid #93c5fd}
.qhead{display:flex;align-items:center;gap:10px}
.badge{font-size:13px;font-weight:800;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 9px}
.question{font-size:21px;font-weight:800;line-height:1.6;margin:18px 0}
.option{border:2px solid var(--line);border-radius:12px;padding:13px 14px;margin:9px 0;cursor:pointer;display:flex;gap:10px}
.option:hover{background:#f8fafc}
.option.selected{border-color:var(--blue);background:#eff6ff}
.option.correct{border-color:#22c55e;background:#ecfdf5}
.option.wrong{border-color:#ef4444;background:#fef2f2}
.letter{font-weight:900;min-width:24px}
.feedback{padding:14px;border-radius:11px;margin-top:15px;line-height:1.7}
.feedback.good{background:#ecfdf5}
.feedback.bad{background:#fef2f2}
.key{margin-top:8px;font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:18px 0}
.nav{padding:7px 0;font-size:11px;background:#edf1f6}
.nav.done{background:#dbeafe}
.nav.wrong{background:#fee2e2}
.hidden{display:none}
.score{font-size:58px;font-weight:950;color:var(--blue)}
.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.searchResults{margin-top:10px;max-height:380px;overflow:auto}
.searchItem{border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer;line-height:1.5}
.searchItem:hover{background:#f8fafc}
.small{font-size:13px;color:var(--muted)}
@media(max-width:650px){.question{font-size:19px}.grid{grid-template-columns:repeat(10,1fr)}.nav{font-size:9px;padding:6px 0}}
</style>
</head>

<script>
const BANK=[{"q":"分散式阻斷服務（DDoS）攻擊有哪些類型？","opts":["密碼噴射、協議攻擊與中間人攻擊（MITM）","密碼噴射、字典攻擊與資源層攻擊","資源層攻擊、協定攻擊與體積攻擊","字典攻擊、中間人攻擊（MITM）以及體積攻擊"],"ans":2,"exp":"系統解析：DDoS 攻擊常見的三種類型為資源層攻擊、協定攻擊與體積攻擊。其他選項屬於不同類型的攻擊，不符合題目描述。","key":"","cat":"SC-900"},{"q":"Azure 有哪些功能提供應用程式層級的過濾和 SSL 終止功能？","opts":["分散式阻斷服務（DDoS）防護","Azure Firewall","Azure Web Application Firewall（WAF）","Azure Bastion hosts"],"ans":2,"exp":"Azure WAF provides all these capabilities. DDoS protection does not provide filtering. Azure Firewall does not provide SSL termination. Bastion does not provide filtering.","key":"","cat":"SC-900"},{"q":"哪一種陳述描述網路安全群組（NSG）？","opts":["提供網路層流量過濾功能，限制流量至每個訂閱中虛擬網路內的資源。","保護網頁應用程式免受常見漏洞與漏洞侵害。","提供集中式網路防火牆即服務（as-a-service），在不同訂閱與虛擬網路間提供網路及應用層級的保護。","允許只鎖定進站流量，降低攻擊風險。"],"ans":0,"exp":"NSGs provide distributed network layer traffic filtering to limit traffic to resources within virtual networks in each subscription.","key":"","cat":"SC-900"},{"q":"你可以用什麼方法透過 Azure 入口網站遠端透過 RDP 和 SSH 連接 Azure 虛擬機？","opts":["Azure Web Application Firewall（WAF）","Microsoft Entra ID Protection","Microsoft Defender for Cloud","Azure Bastion"],"ans":3,"exp":"Bastion is a service that lets you connect to virtual machines by using a browser and the Azure portal. The Bastion service is a fully platform-managed platform as a service (PaaS) service that you provision on a virtual network.","key":"","cat":"SC-900"},{"q":"Azure 中有以下的入站網路安全群組（NSG）安全規則： 允許 VNetInBound，優先權為 65000 AllowAzureLoadBalancerInBound，優先權為 65001 拒絕所有入境，優先權為 65500 NSG 未定義其他入站規則。 規則會以什麼順序處理？","opts":["AllowVNetInBound 規則會先被處理。AllowAzureLoadBalancerInBound 規則會被處理到第二個。NSG 最後一項將處理的規則是 DenyAllInBound 規則。","DenyAllInBound 規則會先被處理。AllowAzureLoadBalancerInBound 規則會被處理到第二個。NSG 中最後一個會處理的規則是 AllowVNetInBound 規則。","AllowAzureLoadBalancerInBound 規則會先被處理。AllowVNetInBound 規則是第二個處理的。NSG 最後一項將處理的規則是 DenyAllInBound 規則。","DenyAllInBound 規則會先被處理。AllowVNetInBound 規則是第二個處理的。NSG 中最後一個會處理的規則是 AllowVNetInBound 規則。"],"ans":0,"exp":"The lowest priority value always has the priority. 因此規則會依照優先權數值由小到大依序處理：先處理 AllowVNetInBound (65000)，再處理 AllowAzureLoadBalancerInBound (65001)，最後處理 DenyAllInBound (65500)。","key":"","cat":"SC-900"},{"q":"哪個 Azure 服務能集中保護網頁應用程式免受常見漏洞攻擊和漏洞？","opts":["Azure Key Vault","Azure Web Application Firewall（WAF）","Microsoft Entra ID Protection","Microsoft Defender for Cloud"],"ans":1,"exp":"Azure WAF provides centralized protection of web apps from common exploits and vulnerabilities. Key Vault is a centralized cloud service for storing application secrets. Defender for Cloud is an endpoint protection solution and cannot help mitigate these attacks.","key":"","cat":"SC-900"},{"q":"你可以購買哪兩項服務的 Microsoft Defender 雲端方案？","opts":["Azure App Service","Azure Storage","ExpressRoute","Microsoft Entra ID"],"ans":[0,1],"exp":"Defender for Cloud 提供多種方案，其中包括 Microsoft Defender for App Service 以及 Microsoft Defender for Storage。Key Vault、Resource Manager、DNS 等也有對應的 Defender 方案，但 ExpressRoute 與 Entra ID 並不在其中。","key":"","cat":"SC-900"},{"q":"Azure 安全基準測試中使用了哪兩個產業框架？","opts":["網際網路安全中心（CIS）","聯邦資訊處理標準（FIPS）140","開放網路應用程式安全專案（OWASP）","國家標準與技術研究院（NIST）"],"ans":[0,3],"exp":"CIS 是 Azure 安全基準測試主要使用的產業標準之一，NIST 也是另一個常用的標準。FIPS 140 是硬體安全模組的標準，OWASP 則是 Web 應用程式安全相關的標準，並不屬於 Azure 安全基準測試的框架。","key":"","cat":"SC-900"},{"q":"選擇正確完成句子的答案。 [答案選擇] 可用來將 Azure 安全基準的指引套用到 Microsoft Entra 等服務。","opts":["安全基線","Microsoft Sentinel","Microsoft Purview","合規政策"],"ans":0,"exp":"Security baselines for Azure apply guidance from the Azure Security Benchmark to the specific service for which it is defined,並提供一致的安全體驗。合規政策並不是用來直接套用 ASB 指引的工具。","key":"","cat":"SC-900"},{"q":"你可以從 [Target_A] 啟用 Microsoft Defender for Servers 方案。","opts":["Microsoft Defender for Cloud","Microsoft Defender for Endpoints","Microsoft Defender for Identity","Microsoft Defender for Office 365"],"ans":0,"exp":"你可以在 Defender for Cloud 中啟用 Defender for Servers 方案，這是透過 Azure 入口網站的環境設定完成的。Defender for Servers Plan 1 或 Plan 2 可用來保護雲端與內部部署的虛擬機。其他選項如 Endpoints、Identity、Office 365 並不是用來啟用此方案的入口。","key":"","cat":"SC-900"},{"q":"Microsoft Sentinel 包含哪兩種安全系統？","opts":["資料遺失防護（DLP）","安全資訊與事件管理（SIEM）","安全編排自動回應（SOAR）","端點保護平台（EPP）"],"ans":[1,2],"exp":"Microsoft Sentinel 是 SIEM 與 SOAR 系統的結合。SIEM 提供安全資訊與事件管理，SOAR 則提供安全編排與自動化回應。DLP 與 EPP 並不是 Sentinel 的核心功能。","key":"","cat":"SC-900"},{"q":"Microsoft Defender for Cloud Apps 中哪一項功能是用來從活動日誌中擷取資料的？","opts":["雲端探索","應用程式連接器","政策","雲端應用程式目錄"],"ans":1,"exp":"Connectors 會從應用程式及其活動日誌中擷取資料。Policies 用來偵測風險行為、違規與可疑資料點；Cloud apps catalog 用來核准或不核准應用程式；Cloud Discovery 則用來識別組織使用的雲端環境與應用程式。","key":"","cat":"SC-900"},{"q":"Microsoft Secure Score 針對哪兩項服務提供建議？","opts":["Microsoft Entra","Microsoft Teams","Azure SQL Database","Azure Cosmos DB"],"ans":[0,1],"exp":"Microsoft Secure Score 支援 Microsoft 365（包含 Exchange Online）、Microsoft Entra、Microsoft Defender for Endpoint、Defender for Identity、Defender for Cloud Apps 以及 Teams 的建議。Azure SQL Database 與 Cosmos DB 並不在 Secure Score 的建議範圍內。","key":"","cat":"SC-900"},{"q":"哪款 Microsoft 解決方案能讓你符合一般資料保護規範（GDPR）及支付卡產業（PCI）的合規標準？","opts":["Microsoft Defender for Cloud Apps","Microsoft Defender for Identity","Microsoft Defender for Cloud","Microsoft Defender for Office 365"],"ans":0,"exp":"Defender for Cloud Apps 是一款雲端存取安全代理（CASB），支援多種部署模式，包括日誌收集、API 連接器與反向 Proxy。它能協助組織符合 GDPR 與 PCI 的合規標準。其他選項並不具備此合規支援功能。","key":"","cat":"SC-900"},{"q":"使用 Microsoft Defender XDR 會保護哪三個元件？","opts":["身份","終點","應用","分析","行動裝置"],"ans":[0,1,2],"exp":"Microsoft 365 Defender 套件透過 Defender for Identity 與 Entra Identity Protection 保護身份，透過 Defender for Endpoint 保護終端設備，並透過 Defender for Cloud Apps 保護應用程式。此外，它也涵蓋電子郵件與協作服務（Defender for Office 365）。分析與行動裝置並不是 XDR 的主要保護範疇。","key":"","cat":"SC-900"},{"q":"你有一個混合環境，包含一個 Active Directory Domain Services（AD DS）網域。你需要保護你的組織免受憑證竊取、橫向移動及權限升級攻擊。在 Microsoft Defender XDR 中應該使用什麼？","opts":["Microsoft Defender for Cloud Apps","Microsoft Defender for Endpoint","Microsoft Defender for Identity","Microsoft Defender for Office 365"],"ans":2,"exp":"Defender for Identity 會監控內部部署 Active Directory 的訊號，偵測憑證竊取、橫向移動與權限升級等身份型威脅。Defender for Cloud Apps 著重於雲端應用程式的可視性與控制；Defender for Endpoint 保護裝置與伺服器；Defender for Office 365 則專注於電子郵件與協作安全，並不針對 AD 身份攻擊。","key":"","cat":"SC-900"},{"q":"你有 Microsoft 365 E5 訂閱。你需要一個能在端點、身份、電子郵件和應用程式間提供統一偵測、調查與回應的解決方案。你應該用什麼？","opts":["Microsoft Defender for Cloud Apps","Microsoft Defender for Endpoint","Microsoft Defender for Office 365","Microsoft Defender XDR"],"ans":3,"exp":"Microsoft Defender XDR 是一個統一的企業防禦套件，能在事前與事後提供保護，並協調端點、身份、電子郵件與應用程式的偵測、調查與回應。其他選項各自專注於單一領域，只有 Defender XDR 能跨領域整合訊號，提供完整的延伸偵測與回應。","key":"","cat":"SC-900"},{"q":"在共享安全模型中，當客戶在主機基礎設施即服務（IaaS）虛擬機時，會保留哪些責任？","opts":["作業系統","實體主機","實體網路","實體資料中心"],"ans":0,"exp":"在 IaaS 模型下，雲端供應商負責管理 實體主機、網路與資料中心，而客戶則必須管理 作業系統 及其上層的應用程式與資料。這就是共享責任模型的核心概念。","key":"","cat":"SC-900"},{"q":"哪種安全模型假設一切都是開放且不可信的網路？","opts":["共同責任","縱深防禦","零信任","支付卡產業資料安全標準（PCI DSS）合規"],"ans":2,"exp":"Zero Trust 模型假設所有網路都是開放且不可信的，並採取「假設已遭入侵」的思維來設計安全策略。共同責任模型是釐清雲端供應商與客戶的責任分工；縱深防禦則是分層防護的概念；PCI DSS 是合規標準，而非安全模型。","key":"","cat":"SC-900"},{"q":"身份基礎架構的哪一支柱負責定義使用者對網路資源的存取權限？","opts":["行政","認證","授權","審計"],"ans":2,"exp":"Authorization（授權） 負責決定已通過認證的使用者能存取哪些資源，以及存取的層級。Administration 是管理使用者帳號；Authentication 是確認使用者身份；Auditing 則是追蹤認證、授權、管理與資源存取的過程。","key":"","cat":"SC-900"},{"q":"與其他認證方式相比，單一登入（SSO）有什麼優勢？","opts":["使用者可以存取其網域內的資源。","使用者只需一次驗證，即可在任何地方存取資源。","裝置可以被多個使用者共用。","裝置只能由單一使用者使用。"],"ans":1,"exp":"SSO（單一登入） 的優勢在於使用者只需進行一次驗證，就能在任何地方存取資源。存取網域內資源是基本認證的功能，而非 SSO 的特點。裝置共用或限制使用者數量也與 SSO 無關。","key":"","cat":"SC-900"},{"q":"作為主要安全邊界模型的身份，有兩個特徵是什麼？","opts":["針對業務關鍵工作負載的 SaaS 應用可託管於企業網路之外","只有企業設備能完成企業任務","自帶裝置（BYOD）可用於完成企業任務","SaaS 應用無法在企業網路之外託管"],"ans":[0,2],"exp":"在「身份作為主要安全邊界」模型中，業務關鍵的 SaaS 應用可以託管於企業網路之外，而且允許 BYOD（自帶裝置） 用於完成企業任務。這反映了現代安全模型不再依賴傳統的網路邊界，而是以身份為核心。選項 B 與 D 則代表傳統的邊界式安全模型，不符合此概念。","key":"","cat":"SC-900"},{"q":"Active Directory 網域服務（AD DS）具備哪些功能？","opts":["支援行動裝置","支援 SaaS 應用程式","透過每位使用者使用單一身份管理本地系統","管理需要現代認證方法的 LOB 應用程式"],"ans":2,"exp":"AD DS 允許使用者透過單一身份來管理多個內部部署的基礎架構元件與系統。它不支援行動裝置、SaaS 應用程式或需要現代認證方法的 LOB 應用程式。","key":"","cat":"SC-900"},{"q":"應該使用哪種身份，才能讓 Azure 虛擬機器存取 Azure 儲存裝置，而不必手動處理密碼變更？","opts":["使用者","裝置","服務主任","管理身份"],"ans":3,"exp":"Managed identities（管理身份） 由 Microsoft Entra 完全管理，Azure 資源可使用它來存取其他 Azure 資源，而不需要手動管理密碼。使用者身份需要自行管理密碼；裝置身份用於裝置驗證；服務主任則主要用於應用程式，但不適合直接用於 Azure VM 存取 Azure 儲存體。","key":"","cat":"SC-900"},{"q":"你需要允許外部使用者使用你 Azure 訂閱中托管的共享資源。你打算使用每月活躍用戶（MAU）計費，並確保每月前 50,000 MAU 不會被收取費用。你可以使用的 Microsoft Entra ID 的最低版本是多少？","opts":["免費","Microsoft Entra 外部 ID","Microsoft Entra ID P1","Microsoft Entra ID P2"],"ans":2,"exp":"Microsoft Entra ID P1 是最低版本，支援 MAU 計費並且前 50,000 MAU 每月不收費。免費版與外部 ID 版本會依使用者計費，無法享有前 50,000 MAU 免費的優惠。P2 也支援，但 P1 已足夠。","key":"","cat":"SC-900"},{"q":"Microsoft Entra 哪一項功能允許你透過本地的 Active Directory 網域來驗證使用者，而不需要連接本地的網域控制器？","opts":["密碼雜湊同步","通過驗證","聯邦認證","Microsoft Entra 特權身份管理"],"ans":0,"exp":"Password hash synchronization（密碼雜湊同步） 會將 AD 的密碼雜湊（hash of hash）同步到 Microsoft Entra，讓使用者能在雲端完成驗證，而不需要直接連線到本地的網域控制器。Pass-through authentication 與 Federated authentication 都需要本地驗證；PIM 則是用來在提升權限時進行身份管理，並非用於一般驗證。","key":"","cat":"SC-900"},{"q":"哪種認證方法可以使用基於時間的一次性密碼？","opts":["Windows Hello","OATH 硬體令牌","強密碼","密碼雜湊同步"],"ans":1,"exp":"OATH 硬體令牌 使用基於時間的一次性密碼（TOTP），提供額外的安全性。強密碼雖然安全，但不是一次性密碼；密碼雜湊同步是用來在 AD 與 Microsoft Entra 間同步密碼雜湊；Windows Hello 則是透過相機或 PIN 進行驗證，並不使用 TOTP。","key":"","cat":"SC-900"},{"q":"你可以用什麼來防止使用者在 Microsoft Entra ID 中使用組織名稱或該組織產品名稱作為密碼？","opts":["全球禁用密碼清單","Microsoft Entra ID Protection","Microsoft Entra 密碼保護","多重身份驗證（MFA）"],"ans":2,"exp":"Microsoft Entra Password Protection 能防止使用者設定包含組織名稱或產品名稱的弱密碼，並提供防止密碼噴灑攻擊的保護。全球禁用密碼清單雖然能阻擋常見弱密碼，但不涵蓋組織或產品名稱；ID Protection 著重於風險式驗證；MFA 則是額外驗證機制，並不管理密碼內容。","key":"","cat":"SC-900"},{"q":"根據 Microsoft Azure 安全分數的建議，管理員決定在組織內提升身份安全。什麼能對使用者身份提供最大保護？","opts":["使用 Microsoft Authenticator 應用程式","強制更改密碼","執行複雜密碼","使用軟代幣"],"ans":0,"exp":"Microsoft Authenticator 應用程式（手機登入）是最強的身份驗證方法，能提供最高層級的保護。強制更改密碼或要求複雜密碼雖然能提升安全性，但不足以提供最大保護；軟代幣的安全性也不如 Microsoft Authenticator。","key":"","cat":"SC-900"},{"q":"使用者可以使用哪些三樣東西來進行 Microsoft Entra 多重驗證（MFA）？","opts":["原告知道的事","原告擁有的","原告是某個","原告無法重複使用的物品","申請人解決的問題"],"ans":[0,1,2],"exp":"Microsoft Entra MFA 的三大要素是：使用者知道的事（例如密碼）、使用者擁有的（例如手機或安全金鑰）、以及使用者本身的特徵（例如指紋或臉部辨識）。這三者結合能提供更強的身份驗證保護。選項 D 與 E 並不是 MFA 的標準要素。","key":"","cat":"SC-900"},{"q":"惡意使用者正試圖使用常用的密碼來存取多個使用者帳號，並每 20 分鐘重複此動作以避免觸發帳號鎖定。哪個 Microsoft Entra 功能能保護組織免受此類攻擊？","opts":["Windows Hello for Business","自助式密碼重設（SSPR）","條件式存取","Microsoft Entra 密碼保護"],"ans":3,"exp":"Microsoft Entra Password Protection 能防止密碼噴灑攻擊，阻止使用者設定弱密碼或包含組織名稱的密碼。條件式存取主要用於根據風險與政策決定存取控制，無法直接阻止密碼攻擊；SSPR 讓使用者自行重設密碼，但不具備防禦攻擊的功能；Windows Hello for Business 則是以強式雙重驗證取代密碼，並非專門用來防止密碼噴灑攻擊。","key":"","cat":"SC-900"},{"q":"你可以用什麼功能根據使用者的城市屬性分配資源存取權？","opts":["Microsoft Entra 特權身份管理","動態群","Microsoft Entra 內建角色","Azure 內置角色"],"ans":1,"exp":"動態群（Dynamic groups） 會根據使用者屬性（例如城市、部門或職位）自動決定群組成員資格，並據此分配資源存取權。Entra 內建角色與 Azure 內置角色是基於角色的存取控制，並不具備動態屬性判斷功能；PIM 則是用於管理與監控特權帳號的存取。","key":"","cat":"SC-900"},{"q":"Microsoft Entra ID 保護系統中的使用者風險是什麼？","opts":["洩露的資歷","非典型旅行","密碼噴射","匿名 IP 位址"],"ans":0,"exp":"洩露的資歷（Leaked credentials） 屬於使用者風險，代表使用者的帳號憑證已外洩。非典型旅行、匿名 IP 位址與密碼噴射則屬於登入風險，主要用來偵測異常登入行為，而非直接的使用者身份風險。","key":"","cat":"SC-900"},{"q":"哪個服務能幫助減輕被入侵用戶帳號的影響？","opts":["Microsoft Defender for Cloud","條件式存取","Microsoft Entra 特權身份管理","Microsoft Entra ID Protection"],"ans":3,"exp":"Microsoft Entra Identity Protection 能利用安全訊號來偵測潛在威脅，並提供風險式存取控制，協助減輕被入侵帳號的影響。Defender for Cloud 著重於雲端資源安全；條件式存取雖能提升安全性，但無法直接緩解帳號入侵；PIM 則是用於管理特權帳號存取，並非專門針對帳號入侵風險。","key":"","cat":"SC-900"},{"q":"你有一個 Microsoft Entra 租戶，需要建立一個存取套件。你應該用什麼？","opts":["Microsoft Defender for Identity","Microsoft Entra 存取審查","Microsoft Entra ID 治理","Microsoft Entra ID Protection"],"ans":2,"exp":"Microsoft Entra ID Governance 提供身份生命週期管理、存取審查、權限管理與存取套件等功能。這使得組織能建立存取套件來管理資源存取。Defender for Identity 偵測身份威脅；存取審查是治理的一部分，但不是建立存取套件的工具；Identity Protection 著重於偵測與回應身份風險。","key":"","cat":"SC-900"},{"q":"你有一個 Microsoft Entra 租戶，需要確保被分配為管理員角色的使用者遵循最小權限原則，透過即時存取與核准工作流程。你應該用什麼？","opts":["Microsoft Defender for Identity","Microsoft Entra ID 治理","Microsoft Entra ID Protection","特權身份管理（PIM）"],"ans":3,"exp":"Privileged Identity Management (PIM) 提供即時（JIT）角色啟用、核准工作流程、時間限制的角色指派，以及存取審查，確保管理員角色遵循最小權限原則。Entra ID Governance 著重於身份生命週期與存取審查；Identity Protection 偵測並回應身份風險；Defender for Identity 偵測基於身份的威脅，但不管理特權角色。","key":"","cat":"SC-900"},{"q":"您可以在哪裡找到有關 Microsoft 安全、隱私與合規實務的資訊、工具及其他資源？","opts":["Azure 入口","Microsoft Defender 入口網站","Microsoft 服務信託入口網站","Microsoft 365 管理中心"],"ans":2,"exp":"Microsoft Service Trust Portal（服務信託入口網站） 提供有關 Microsoft 安全、隱私與合規的資訊、工具與資源。Azure 入口主要用於管理 Azure 資源；Defender 入口網站用於安全防護管理；Microsoft 365 管理中心則用於管理 Microsoft 365 租戶。","key":"","cat":"SC-900"},{"q":"Microsoft Purview 合規管理工具中使用了哪些三種控制措施？","opts":["Microsoft 管理的控制、第三方管理的控制以及客戶管理的控制","Microsoft 管理的控制、共享控制以及客戶管理的控制","第三方控制、共享控制與政府控制","政府控制、客戶管理控制與共享控制"],"ans":1,"exp":"Microsoft 管理的控制、共享控制以及客戶管理的控制 是 Microsoft Purview Compliance Manager 中的三種控制措施。Microsoft 管理的控制由 Microsoft 負責維護；共享控制需要 Microsoft 與客戶共同承擔；客戶管理的控制則完全由客戶負責。第三方或政府控制並不屬於 Purview Compliance Manager 的範疇。","key":"","cat":"SC-900"},{"q":"合規管理工具中的合規分數衡量什麼？","opts":["組織部署安全措施的能力","組織在實施控制措施方面的進展","組織評估控制措施的能力","組織在建立控制措施上的進展"],"ans":1,"exp":"合規分數（Compliance Score） 衡量的是組織在實施控制措施方面的進展。它反映組織完成合規要求的程度，而不是單純的部署能力或評估能力。","key":"","cat":"SC-900"},{"q":"哪三個角色有權限登入 Microsoft Purview 入口網站？","opts":["全球管理員","合規管理員","合規資料管理員","使用者管理員","安全閱讀器"],"ans":[0,1,2],"exp":"Global Administrator、Compliance Administrator、Compliance Data Administrator 這三個角色有權限登入 Microsoft Purview 入口網站。Purview 合規入口主要提供合規性與資料治理功能，因此只有具備這些角色的使用者能存取。使用者管理員與安全閱讀器並不具備登入 Purview 入口的權限。","key":"","cat":"SC-900"},{"q":"你可以用什麼來監控包含敏感資訊的通訊，並將暴露的風險降到最低？","opts":["Microsoft Purview 合規入口網站","Microsoft 服務信託入口網站","Microsoft Defender 門戶","Microsoft Intune 管理中心"],"ans":0,"exp":"Microsoft Purview 合規入口網站 能協助管理員監控並管理組織的合規需求，包含敏感資訊的通訊，並降低資料外洩風險。服務信託入口網站提供合規性相關的資源與文件，但不具備監控功能；Defender 門戶主要用於安全防護；Intune 管理中心則是用於裝置與應用程式管理。","key":"","cat":"SC-900"},{"q":"在 Microsoft Purview 中，您應該用什麼來辨識組織資料中的發票號碼？","opts":["內容探索器","精確資料匹配（EDM）","可訓練分類器","敏感資訊類型"],"ans":3,"exp":"敏感資訊類型（Sensitive Information Type） 能透過模式（例如正則表達式）、關鍵字或函數來辨識特定格式的資料，如發票號碼。內容探索器用於檢視已標記的敏感內容；EDM 用於比對精確字串（如社會安全號碼）；可訓練分類器則需透過大量資料訓練模型來辨識語意模式。","key":"","cat":"SC-900"},{"q":"在 Microsoft Purview 中，你應該建立什麼來自動加密使用者標記為機密的文件？","opts":["敏感度標籤與敏感度標籤政策","敏感標籤與保留政策","保留標籤與敏感標籤政策","保留標籤與保留政策"],"ans":0,"exp":"敏感度標籤與敏感度標籤政策 能讓管理員建立並發佈標籤，使用者在標記文件為機密時，系統會自動套用加密與保護。其他選項主要用於資料保留或 DLP（資料外洩防護），並不具備自動加密的功能。","key":"","cat":"SC-900"},{"q":"在 Microsoft Purview 中，哪種政策可以防止包含個人身份的文件在組織外被分享？","opts":["敏感標籤政策","留任政策","資料遺失防護（DLP）政策","Azure Policy"],"ans":2,"exp":"資料遺失防護（DLP）政策 能防止包含個人身份資訊的文件在組織外被分享，藉由偵測並封鎖敏感資料的外洩。敏感標籤政策主要用於標記與分類資料；留任政策則是用來定義文件的保存期限；Azure Policy 則是用於管理 Azure 資源的設定，並非針對資料外洩防護。","key":"","cat":"SC-900"},{"q":"在 Microsoft Purview 中，您可以使用什麼來標註項目為法規紀錄、維護項目刪除的證明，以及匯出已處理物品的資訊？","opts":["保留標籤與保留標籤政策","保留政策","敏感度標籤與敏感度標籤政策","資料遺失防護（DLP）政策"],"ans":0,"exp":"保留標籤與保留標籤政策 是 Microsoft Purview 中的紀錄管理功能，能將項目標註為法規紀錄、提供刪除的證明，以及匯出已處理物品的資訊。保留政策僅定義文件保存期限；敏感度標籤用於分類與加密資料；DLP 政策則是防止敏感資料外洩，並不具備紀錄管理功能。","key":"","cat":"SC-900"},{"q":"你可以用什麼來防止 Microsoft Teams 中敏感資訊被無意中洩露？","opts":["Microsoft Defender for Cloud","Microsoft Sentinel 工作簿","Microsoft Purview 資料遺失防護（DLP）政策","Microsoft Defender for Office 365 安全連結"],"ans":2,"exp":"Microsoft Purview DLP 政策 能偵測並防止敏感資訊在 Microsoft Teams 中被無意中分享或外洩。Defender for Cloud 著重於雲端工作負載保護；Sentinel 工作簿用於安全監控與視覺化；Defender for Office 365 安全連結則是防止惡意連結攻擊，並非用來防止敏感資訊洩露。","key":"","cat":"SC-900"},{"q":"你需要為公司中特定使用者保留信箱和檔案資料五年。你應該用什麼？","opts":["Microsoft Defender for Cloud Apps","Microsoft Priva","Microsoft Purview 資料生命週期管理","Microsoft Purview 資料遺失防護（DLP）"],"ans":2,"exp":"Microsoft Purview 資料生命週期管理（Data Lifecycle Management） 提供保留政策與保留標籤，能確保信箱與檔案資料在指定期間（例如五年）被保留，並在到期後依組織需求刪除。Defender for Cloud Apps 著重於雲端應用程式的使用監控；Priva 著重於隱私風險與資料主體權利；DLP 則是防止敏感資料外洩，並不負責資料的保存期限。","key":"","cat":"SC-900"},{"q":"在 Microsoft Purview 中，可以用什麼工具調查可能的安全或合規漏洞，並根據紀錄辨識其範圍？","opts":["審核（高級）","內容搜尋","電子發現","合規經理"],"ans":0,"exp":"Audit (Premium) 能讓組織調查可能的安全或合規漏洞，並根據審核紀錄辨識其範圍。內容搜尋主要用於搜尋文件；電子發現（eDiscovery）用於建立案件與指派管理者；合規經理則是用來追蹤合規分數與控制措施，而不是用來進行事件調查。","key":"","cat":"SC-900"},{"q":"什麼能幫助你辨識合規稽核所需的文件？","opts":["Microsoft 服務信託入口網站","Microsoft Purview 合規管理","Microsoft Purview 通訊合規","Microsoft Purview eDiscovery"],"ans":3,"exp":"Microsoft Purview eDiscovery 能協助組織識別並交付電子資訊，作為法律案件或合規稽核的證據。服務信託入口網站提供合規性相關的資源與文件，但不具備稽核文件識別功能；Purview 合規管理主要用於追蹤合規分數與控制措施；通訊合規則用於監控組織內的通訊行為。","key":"","cat":"SC-900"},{"q":"哪種服務能持續評估安全態勢、識別威脅，並強化 Azure 及本地工作負載中的資源？","opts":["Azure Firewall","Microsoft Defender for Cloud","Azure Web Application Firewall（WAF）","Microsoft Purview"],"ans":1,"exp":"Microsoft Defender for Cloud 提供持續的安全態勢評估、威脅偵測與資源強化功能，涵蓋 Azure 與本地工作負載。Azure Firewall 不會強化資源或評估威脅，WAF 專注於保護 Web 應用程式，Purview 則是資料治理服務。","key":"","cat":"SC-900"},{"q":"你可以用什麼來管理包含 AWS 和 GCP 在內的多雲環境的安全？","opts":["Microsoft Defender for Cloud","Microsoft Purview 內部風險管理","Microsoft 安全分數","Microsoft Entra 特權身份管理"],"ans":0,"exp":"Microsoft Defender for Cloud 能連線並保護 AWS 與 GCP 上的資源，提供跨多雲環境的安全管理。Purview 著重於資料治理與合規，安全分數用於衡量安全態勢，Entra PIM 則是管理特權帳號，並不具備多雲安全管理功能。","key":"","cat":"SC-900"},{"q":"Microsoft Defender for Cloud 的強化安全性包含哪兩項功能？","opts":["端點偵測與回應（EDR）","針對 SQL 資源的漏洞掃描","安全資訊與事件管理（SIEM）色彩","安全基準建議"],"ans":[0,1],"exp":"Defender for Cloud 的強化安全性功能包括 EDR 以及 SQL 資源的漏洞掃描。SIEM 整合屬於 Microsoft Sentinel 的功能，而安全基準建議則是 Azure Security Benchmark 的一部分，不屬於 Defender for Cloud 強化安全性。","key":"","cat":"SC-900"},{"q":"你可以用什麼來設定安全政策、標準和建議？","opts":["Microsoft Defender for Cloud","Microsoft Defender for Cloud Apps","Microsoft Defender for Endpoints","Microsoft Defender for Identity"],"ans":0,"exp":"Microsoft Defender for Cloud 能讓你設定安全政策、標準與建議，並管理雲端基礎架構的合規性與安全態勢。Defender for Cloud Apps 著重於雲端應用程式的存取控制，Endpoints 是端點防護，Identity 則是身分保護，皆不具備設定安全政策的功能。","key":"","cat":"SC-900"},{"q":"你可以用什麼來將安全警示整合成事件，並建立對安全警示的自動回應？","opts":["Microsoft Sentinel","Microsoft Defender for Cloud","Microsoft Intune","Microsoft Defender XDR"],"ans":0,"exp":"Microsoft Sentinel 能將安全警示整合成事件，並建立自動化回應。Defender for Cloud 與 Defender XDR 需要與 Sentinel 整合才能進行事件管理，而 Intune 著重於裝置管理，無法處理資安事件。","key":"","cat":"SC-900"},{"q":"你可以在 Microsoft Sentinel 中使用什麼來建立視覺化報告？","opts":["工作手冊","分析","戰術手冊","狩獵"],"ans":0,"exp":"工作手冊 (Workbooks) 能與 Azure Monitor 整合，提供視覺化報告與監控功能。分析 (Analytics) 用於將警示關聯成事件，戰術手冊 (Playbooks) 是事件回應程序集合，狩獵 (Hunting) 則是基於 MITRE 框架的查詢工具，並非用來建立視覺化報告。","key":"","cat":"SC-900"},{"q":"在 Microsoft Sentinel 中，事件是一組相關的什麼？","opts":["警報","工作手冊","安全任務","狩獵查詢"],"ans":0,"exp":"事件 (Incident) 是由一組相關的 警報 (Alerts) 所組成。這些警報透過分析被關聯起來，形成可操作的潛在威脅，讓你能進一步調查與解決。工作手冊是用來建立視覺化報告，安全任務並非 Sentinel 的功能，狩獵查詢則是用來主動搜尋威脅。","key":"","cat":"SC-900"},{"q":"哪款 Microsoft Defender XDR 解決方案能防範惡意電子郵件威脅？","opts":["Microsoft Defender for Office 365","Microsoft Defender for Endpoint","Microsoft Defender for Identity","Microsoft Defender for Cloud Apps"],"ans":0,"exp":"Microsoft Defender for Office 365 能防範電子郵件、連結 (URL)、以及協作工具（如 Teams、SharePoint Online、OneDrive for Business 等）中的惡意威脅。Defender for Endpoint 著重於裝置防護，Defender for Identity 保護身分，Defender for Cloud Apps 則專注於雲端應用程式存取控制，並非專門針對電子郵件威脅。","key":"","cat":"SC-900"},{"q":"Microsoft 的隱私策略建立在什麼之上？","opts":["控制、透明、安全、強而有力的法律保護、無內容導向目標，且對你有利","控制、透明度、安全性、法律保護、有限的內容導向目標，以及對 Microsoft 與你雙方的互利","治理、透明度、安全性、無內容導向目標、資訊自由，並對你有利","治理、透明度、安全性、內容導向目標、資訊自由，以及對你的好處"],"ans":0,"exp":"Microsoft 的隱私策略建立在「控制、透明、安全、強而有力的法律保護、無內容導向目標，且對你有利」之上。這些原則確保使用者能掌握自己的資料，並享有隱私保護與安全保障。其他選項雖有部分相似，但不符合 Microsoft 官方隱私原則的完整定義。","key":"","cat":"SC-900"},{"q":"有什麼工具可以用來建立一個統一的資料治理服務，實現端對端的資料血統？","opts":["Active Directory","Microsoft Defender for SQL","Microsoft Purview","Microsoft Intune"],"ans":2,"exp":"Microsoft Purview 是一個統一的資料治理服務，能管理內部部署、多雲以及 SaaS 資料，並提供端對端的資料血統 (data lineage)。Active Directory 著重於身分與存取管理；Defender for SQL 是資料庫安全解決方案；Intune 則是裝置與應用程式管理工具，皆不具備資料治理與血統功能。","key":"","cat":"SC-900"},{"q":"在 Microsoft Purview 中，你可以用什麼來偵測潛在的敏感資料外洩和智慧財產權竊取？","opts":["資料生命週期管理","電子發現","資訊保護","內部風險管理"],"ans":3,"exp":"內部風險管理 (Insider Risk Management) 能協助偵測並降低敏感資料外洩、資料溢出、機密違規、智慧財產竊取、詐欺、內線交易，以及合規性違規等風險。資料生命週期管理主要用於保留與刪除資料；電子發現 (eDiscovery) 用於法律案件的資料搜尋與管理；資訊保護則是用於分類與加密資料，並非專門偵測內部風險。","key":"","cat":"SC-900"},{"q":"在 Microsoft Purview 內部風險管理中，應該為需要進一步調查的電子發現內容建立什麼？","opts":["一個案例","一項政策","一個標籤"],"ans":0,"exp":"案例 (Case) 是內部風險管理中用來進一步調查的單位。當警示需要更深入的調查時，必須將其新增到案例中。每個案例與一位使用者相關，並且可以包含多個警示。政策則是用來定義偵測規則，標籤則用於分類資料，並不適合用來進行調查。","key":"","cat":"SC-900"},{"q":"哪種安全模型採用分層式的安全方法，提供機制在每層邊緣阻止入侵？","opts":["縱深防禦","支付卡產業資料安全標準（PCI DSS）合規","共同責任","零信任"],"ans":0,"exp":"縱深防禦 (Defense in Depth) 採用分層式安全方法，在每一層邊緣提供防護機制，以阻止入侵並降低風險。共同責任模型是釐清雲端供應商與客戶的責任分工；PCI DSS 是合規標準，而非安全模型；零信任則是「假設已遭入侵」的安全思維，並非分層防禦。","key":"","cat":"SC-900"},{"q":"你應該用什麼來儲存受保護格式的密碼？","opts":["對稱加密","非對稱加密","雜湊","對稱與非對稱加密的結合"],"ans":2,"exp":"雜湊 (Hashing) 是儲存密碼的最佳方式，因為雜湊是單向的，無法還原原始密碼。對稱或非對稱加密雖然能保護資料，但它們允許解密，這在密碼儲存上是不安全的。透過雜湊，系統能驗證使用者輸入的密碼是否正確，而不需要存放可解密的原始密碼。","key":"","cat":"SC-900"},{"q":"哪種加密方法使用公鑰與私鑰配對？","opts":["對稱加密","共用金鑰","雜湊","非對稱加密"],"ans":3,"exp":"非對稱加密 (Asymmetric Encryption) 使用公鑰與私鑰配對。公鑰可用來加密資料，而私鑰則用來解密，反之亦然。這種方式能確保資料在傳輸過程中的安全性。對稱加密僅使用單一金鑰；共用金鑰不是正式的加密方法；雜湊則是單向運算，無法解密。","key":"","cat":"SC-900"},{"q":"聯邦的特徵是什麼？","opts":["聯邦必須是雲端架構","聯邦化讓跨組織能夠存取服務","信任始終是雙向的","使用者必須在其他網域中維持不同的使用者名稱"],"ans":1,"exp":"聯邦化 (Federation) 的特徵是允許跨組織存取服務。身份提供者可以是內部部署或雲端，信任並非一定是雙向的，使用者也不需要在其他網域維持不同的使用者名稱。這使得不同組織之間能安全地共享資源與服務。","key":"","cat":"SC-900"},{"q":"Microsoft Entra ID 提供哪些功能？","opts":["使用者單點登入（SSO）","縱深防禦","靜態資料的加密","傳輸中資料的加密"],"ans":0,"exp":"使用者單點登入 (SSO) 是 Microsoft Entra ID 的核心功能之一，讓使用者能以單一帳號安全地存取多個應用程式與服務。Entra ID 也支援聯邦與身份治理，但並不直接提供靜態或傳輸中資料的加密功能；縱深防禦則是一種安全模型，而非 Entra ID 的特定功能。","key":"","cat":"SC-900"},{"q":"是哪項服務讓 Microsoft Entra 能夠透過使用外部使用者的社會識別碼（例如 Google 或 Apple ID）來認證？","opts":["Microsoft Entra B2B","Microsoft Entra 外部ID","Active Directory 網域服務（AD DS）","Active Directory Web Services（ADWS）"],"ans":1,"exp":"Microsoft Entra 外部 ID (External ID) 允許外部使用者使用其偏好的社會帳號（如 Google、Apple ID）、企業帳號或本地帳號登入，並取得單一登入 (SSO) 存取應用程式。AD DS 無法讓外部使用者透過社會帳號驗證；ADWS 只是提供 AD DS 與 AD LDS 的 Web 介面；Entra B2B 則是用來與外部組織共享應用與服務，而不是直接支援社會身份登入。","key":"","cat":"SC-900"},{"q":"用哪種類型的 Microsoft 身份來識別應用程式？","opts":["服務主任","管理身份","裝置","使用者"],"ans":0,"exp":"服務主任 (Service Principal) 本質上就是應用程式的身份。當應用程式要與 Microsoft Entra 整合並委派其身份與存取功能時，必須先在 Entra 中註冊，之後會在每個使用該應用程式的租戶中建立服務主任。管理身份 (Managed Identity) 是用於 Azure 資源之間的存取；裝置身份用於裝置管理；使用者身份則是用於人員登入，而不是應用程式。","key":"","cat":"SC-900"},{"q":"在 Microsoft Entra ID 中，自助密碼重設（SSPR）有哪兩種認證方法可用？","opts":["Windows Hello","電子郵件","安全問題","護照"],"ans":[1,2],"exp":"電子郵件 (Email) 與 安全問題 (Security Questions) 是 Microsoft Entra ID 自助密碼重設 (SSPR) 可用的兩種認證方法。使用者可以透過電子郵件驗證或回答事先設定的安全問題來完成密碼重設。Windows Hello 與護照並不是 SSPR 的支援方法。","key":"","cat":"SC-900"},{"q":"在條件存取政策中，可以用哪種條件來評估使用者帳號被入侵的可能性？","opts":["地點","裝置狀態","使用者風險","登入風險"],"ans":2,"exp":"使用者風險 (User Risk) 能評估使用者帳號遭入侵的可能性，並根據風險等級決定是否允許或阻止存取。登入風險 (Sign-in Risk) 則是判斷特定登入嘗試是否具風險，例如來自可疑 IP；裝置狀態用於檢查裝置平台或合規性；地點則是依據 IP 網路位置來判斷。","key":"","cat":"SC-900"},{"q":"哪兩個訊號可以作為條件存取的一部分使用？","opts":["團體成員","裝置平台","密碼長度","電話號碼"],"ans":[0,1],"exp":"團體成員 (Group Membership) 與 裝置平台 (Device Platform) 都能作為條件存取的訊號。條件存取可根據使用者或群組成員資格、裝置平台、位置、應用程式、即時登入風險偵測、雲端應用或動作，以及使用者風險等訊號來決定存取政策。密碼長度與電話號碼並不是條件存取的訊號。","key":"","cat":"SC-900"},{"q":"Microsoft Entra 的最低版本是多少，可以讓你為使用者建立存取套件？","opts":["免費","Microsoft Entra 外部 ID","Microsoft Entra ID P1","Microsoft Entra ID P2"],"ans":3,"exp":"Microsoft Entra ID P2 支援 權限管理 (Entitlement Management)，這項功能能讓你建立存取套件，並透過自動化流程管理使用者對資源的存取。免費版與外部 ID 不支援此功能；P1 雖然提供基礎的身份治理，但不包含存取套件；P2 則是最低需要的版本。","key":"","cat":"SC-900"},{"q":"你有一個 Microsoft Entra 租戶，需要授權有時間限制的行政職務存取權限。你應該用什麼？","opts":["Microsoft Entra 存取套件","Microsoft Entra 存取評測","Microsoft Entra Conditional Access","特權身份管理（PIM）"],"ans":3,"exp":"特權身份管理 (Privileged Identity Management, PIM) 提供即時 (JIT) 與時間限制的管理員角色存取，並支援核准工作流程，確保符合最小權限原則。存取評測 (Access Reviews) 用於定期檢查使用者存取權限；Conditional Access 是零信任政策引擎，主要用於即時存取決策；存取套件則是權限管理的一部分，用來打包資源存取，但不專門用於時間限制的管理員角色授權。","key":"","cat":"SC-900"},{"q":"在共享安全模型中，當客戶在 IaaS 虛擬機時，會保留哪些責任？","opts":["作業系統","實體主機","實體網路","實體資料中心"],"ans":0,"exp":"客戶必須管理作業系統與應用程式；雲端供應商則管理主機、網路與資料中心。","key":"","cat":"SC-900"},{"q":"哪種加密方法使用相同的金鑰來加密和解密資料？","opts":["對稱加密","非對稱加密","雜湊"],"ans":0,"exp":"對稱加密使用同一金鑰加解密；非對稱加密使用公私鑰；雜湊是單向演算法。","key":"","cat":"SC-900"},{"q":"零信任模式的指導原則是什麼？","opts":["明確驗證","進階使用者存取","違規測試","信任本地網路"],"ans":0,"exp":"零信任三大原則：明確驗證、最小權限存取、假設已遭入侵。","key":"","cat":"SC-900"},{"q":"單一登入（SSO）有什麼功能？","opts":["使用者可登入一次，且不必再登入","利用個別身份提供者","使用同一憑證存取多個應用程式或資源","因為有集中式目錄，省去了密碼重設"],"ans":2,"exp":"SSO 讓使用者用一組憑證存取多個應用程式，透過集中式身份提供者簡化驗證。","key":"","cat":"SC-900"},{"q":"Microsoft Entra 哪一項功能允許你透過本地 AD 網域驗證使用者，而不需連接本地網域控制器？","opts":["密碼雜湊同步","通過驗證","聯邦認證","Microsoft Entra PIM"],"ans":0,"exp":"密碼雜湊同步將本地 AD 的密碼雜湊同步到 Entra，讓雲端完成驗證。","key":"","cat":"SC-900"},{"q":"哪項服務讓 Microsoft Entra 能透過外部使用者的社會識別碼（如 Google/Apple ID）來認證？","opts":["Microsoft Entra B2B","Microsoft Entra 外部 ID","AD DS","ADWS"],"ans":1,"exp":"Entra 外部 ID 允許外部使用者用社會帳號登入並取得 SSO；B2B 是共享應用服務，不直接支援社會身份登入。","key":"","cat":"SC-900"},{"q":"一個組織正在遷移到 Microsoft 雲端，計畫採用混合身份模型。什麼可以用來同步 AD DS 與 Microsoft Entra 租戶之間的身份？","opts":["AD FS","Microsoft Sentinel","Microsoft Entra Connect Sync","Microsoft Entra PIM"],"ans":2,"exp":"Entra Connect Sync 專為混合身份設計，能同步本地 AD DS 與 Entra 租戶。","key":"","cat":"SC-900"},{"q":"Microsoft Entra 在登入時有哪兩種認證方式可用？","opts":["密碼","簡訊認證","安全問題","駕照","致電客服中心"],"ans":[0,1],"exp":"支援密碼與簡訊認證。安全問題不適用於登入；駕照與客服電話不是認證方法。","key":"","cat":"SC-900"},{"q":"Entra ID 中還提供哪兩種額外的身份驗證方式，可用於任何裝置的 MFA？","opts":["Microsoft Authenticator","FIDO2 通行金鑰","臉部辨識","指紋辨識"],"ans":[0,1],"exp":"Authenticator 與 FIDO2 可跨裝置使用；臉部與指紋僅限 Windows Hello。","key":"","cat":"SC-900"},{"q":"在 Entra ID 中，SSPR 有哪兩種認證方法可用？","opts":["Windows Hello","電子郵件","安全問題","護照"],"ans":[1,2],"exp":"SSPR 支援電子郵件與安全問題。Windows Hello 與護照不適用。","key":"","cat":"SC-900"},{"q":"啟用 SSPR 需要哪三個步驟？","opts":["指派 Entra ID 授權","啟用使用者的 SSPR","註冊認證方式","註冊 Microsoft 帳號","建立封禁密碼清單"],"ans":[0,1,2],"exp":"必須指派授權、啟用 SSPR、並註冊認證方式。其他選項非必要。","key":"","cat":"SC-900"},{"q":"當使用者存取 Entra 租戶中的應用程式時，如何強制 MFA？","opts":["密碼雜湊同步","條件式存取","RBAC","NSG"],"ans":1,"exp":"條件式存取可根據情境強制 MFA。RBAC 是授權控制；NSG 是網路規則。","key":"","cat":"SC-900"},{"q":"哪兩個訊號可作為條件存取的一部分？","opts":["團體成員","裝置平台","密碼長度","電話號碼"],"ans":[0,1],"exp":"條件存取可依群組成員與裝置平台等訊號決策。密碼長度與電話號碼不屬於訊號。","key":"","cat":"SC-900"},{"q":"Entra 中最小授權的角色，可建立與管理使用者和群組？","opts":["全球管理員","安全管理員","使用者管理員","Teams 管理員"],"ans":2,"exp":"使用者管理員能管理使用者與群組，權限最小。全球管理員權限過大。","key":"","cat":"SC-900"},{"q":"Entra RBAC 與 Azure RBAC 的不同？","opts":["Entra 控制使用者/群組/應用程式；Azure 控制 VM 等資源","Entra 控制 VM；Azure 控制使用者","Entra 角色可購買訂閱；Azure 可管理 Entra","Entra 管理功能；Azure 管理訂閱"],"ans":0,"exp":"Entra RBAC 控制 Entra 資源；Azure RBAC 控制 Azure 資源。範疇不同。","key":"","cat":"SC-900"},{"q":"如何根據使用者城市屬性分配資源存取？","opts":["PIM","動態群","Entra 內建角色","Azure 內置角色"],"ans":1,"exp":"動態群可依使用者屬性（如城市）自動決定成員資格並分配資源。","key":"","cat":"SC-900"},{"q":"哪一項 Microsoft 隱私原則定義了加密金鑰的使用與管理？","opts":["透明度","安全性","控制","強有力的法律保護"],"ans":1,"exp":"安全性原則定義加密與金鑰管理的使用方式，確保資料受到保護。","key":"","cat":"SC-900"},{"q":"在哪裡可以找到 Microsoft 雲端服務的獨立稽核報告與評估？","opts":["Microsoft 服務信任入口網站","Microsoft 雲端帳戶管理員","privacy.microsoft.com","portal.azure.com"],"ans":0,"exp":"Service Trust Portal 提供獨立稽核報告與合規性評估。","key":"","cat":"SC-900"},{"q":"合規管理工具中的合規分數衡量什麼？","opts":["部署安全措施的能力","在實施控制措施方面的進展","評估控制措施的能力","建立控制措施的進展"],"ans":1,"exp":"合規分數衡量的是組織在落實控制措施上的進展。","key":"","cat":"SC-900"},{"q":"Microsoft 雲端服務使用哪種類型的合規管理控制？","opts":["客戶管理控制","共用控制","Microsoft 管理的控制項","評估控制"],"ans":2,"exp":"Microsoft-managed controls 由 Microsoft 維護，確保雲端服務合規。","key":"","cat":"SC-900"},{"q":"你有 Microsoft 365 E5 訂閱，需要取得通訊合規解決方案。你應該用什麼？","opts":["Microsoft 365 管理中心","Microsoft Defender 入口網站","Microsoft Entra 管理中心","Microsoft Purview 入口網站"],"ans":3,"exp":"Purview 入口網站是合規與風險解決方案的集中介面。","key":"","cat":"SC-900"},{"q":"在 Purview 中，什麼能自動加密使用者標記為機密的文件？","opts":["敏感度標籤與敏感度標籤政策","敏感標籤與保留政策","保留標籤與敏感標籤政策","保留標籤與保留政策"],"ans":0,"exp":"敏感度標籤與政策能自動套用加密與保護。","key":"","cat":"SC-900"},{"q":"在 Purview 中，哪種政策可防止含個人身份的文件外洩？","opts":["敏感標籤政策","留任政策","資料遺失防護（DLP）政策","Azure Policy"],"ans":2,"exp":"DLP 政策能偵測並防止敏感資料外洩。","key":"","cat":"SC-900"},{"q":"在 Purview 中，什麼能標註項目為法規紀錄並維護刪除證明？","opts":["保留標籤與保留標籤政策","保留政策","敏感度標籤與政策","DLP 政策"],"ans":0,"exp":"保留標籤與政策是紀錄管理功能，能提供刪除證明與匯出資訊。","key":"","cat":"SC-900"},{"q":"Purview 資訊保護與資料生命週期管理協同運作，以[回答選擇]資料。","opts":["分類、保護與治理","分類、保護與備份","探索、保護與分享","探索、保護與後退"],"ans":0,"exp":"兩者協同運作，能分類、保護並治理資料，確保合規。","key":"","cat":"SC-900"},{"q":"你可以用什麼在 Azure 裡實作基於部門的網路分段？","opts":["虛擬網路","虛擬私人網路","碧堡","Azure Private Link"],"ans":0,"exp":"虛擬網路是 Azure 中的核心分段方式。VPN 用於連線不同網路；Bastion 提供安全存取；Private Link 用於安全存取服務。","key":"","cat":"SC-900"},{"q":"你有 Microsoft 365 E5 訂閱。你需要統一偵測、調查與回應的解決方案。","opts":["Cloud Apps","Endpoint","Office 365","Defender XDR"],"ans":3,"exp":"Defender XDR 整合端點、身份、郵件與應用程式的訊號，提供完整的延伸偵測與回應。","key":"","cat":"SC-900"},{"q":"要在 Azure 中實作網路分段，必須建立什麼？","opts":["堡壘主辦單位","防火牆","安全群組","虛擬網路"],"ans":3,"exp":"虛擬網路是分段的基礎。防火牆控制存取；Bastion 提供連線；安全群組用於存取控制。","key":"","cat":"SC-900"},{"q":"透過 Azure 入口網站遠端連線 VM 的方法？","opts":["WAF","Entra ID Protection","Defender for Cloud","Bastion"],"ans":3,"exp":"Bastion 提供 RDP/SSH 連線，避免 VM 公開到網際網路。","key":"","cat":"SC-900"},{"q":"哪個服務能集中保護 Web 應用程式？","opts":["Key Vault","WAF","Entra ID Protection","Defender for Cloud"],"ans":1,"exp":"WAF 防止常見 Web 漏洞攻擊。Key Vault 用於秘密管理；Entra ID 保護身份；Defender for Cloud 側重資源安全。","key":"","cat":"SC-900"},{"q":"哪個服務能持續評估安全態勢並強化資源？","opts":["Firewall","Defender for Cloud","WAF","Purview"],"ans":1,"exp":"Defender for Cloud 提供安全態勢評估與威脅偵測。","key":"","cat":"SC-900"},{"q":"管理 AWS/GCP 多雲環境的安全？","opts":["Defender for Cloud","Purview","安全分數","Entra PIM"],"ans":0,"exp":"Defender for Cloud 能保護跨多雲資源。","key":"","cat":"SC-900"},{"q":"Defender for Cloud 強化安全性包含哪兩項？","opts":["EDR","SQL 漏洞掃描","SIEM","安全基準"],"ans":[0,1],"exp":"EDR 與 SQL 漏洞掃描屬於強化安全性；SIEM 屬於 Sentinel；安全基準屬於 Azure Security Benchmark。","key":"","cat":"SC-900"},{"q":"從哪裡啟用 Defender for Servers？","opts":["Defender for Cloud","Endpoint","Identity","Office 365"],"ans":0,"exp":"必須在 Defender for Cloud 中啟用。","key":"","cat":"SC-900"},{"q":"設定安全政策、標準和建議的服務？","opts":["Defender for Cloud","Cloud Apps","Endpoint","Identity"],"ans":0,"exp":"Defender for Cloud 能設定安全政策與合規性。","key":"","cat":"SC-900"},{"q":"SOAR 解決方案包含哪兩個特性？","opts":["收集資料","資料相關性","行動驅動工作流程","問題緩解"],"ans":[2,3],"exp":"SOAR 提供自動化工作流程與事件緩解。","key":"","cat":"SC-900"},{"q":"將警示整合成事件並建立自動回應？","opts":["Sentinel","Defender for Cloud","Intune","Defender XDR"],"ans":0,"exp":"Sentinel 能整合警示並建立自動化回應。","key":"","cat":"SC-900"},{"q":"在 Sentinel 中，事件是一組相關的什麼？","opts":["警報","工作手冊","安全任務","狩獵查詢"],"ans":0,"exp":"事件由相關警報組成，形成可操作的威脅。","key":"","cat":"SC-900"},{"q":"在 Sentinel 中調查事件時應檢視什麼？","opts":["書籤","戰術手冊","警報","事件"],"ans":3,"exp":"事件提供集中檢視，包含警報、實體與時間軸。","key":"","cat":"SC-900"},{"q":"保護 AD DS 網域免受憑證竊取攻擊？","opts":["Cloud Apps","Endpoint","Identity","Office 365"],"ans":2,"exp":"Defender for Identity 偵測憑證竊取與橫向移動。","key":"","cat":"SC-900"},{"q":"在 Microsoft 365 E5 中，跨端點、身份、郵件與應用程式的統一解決方案？","opts":["Cloud Apps","Endpoint","Office 365","Defender XDR"],"ans":3,"exp":"Defender XDR 提供統一的偵測、調查與回應。","key":"","cat":"SC-900"},{"q":"你需要統一偵測、調查與回應的解決方案？","opts":["Defender XDR","Endpoint","Office 365","Cloud Apps"],"ans":0,"exp":"Defender XDR 整合多領域訊號。","key":"","cat":"SC-900"},{"q":"你有混合環境，需保護 AD DS？","opts":["Cloud Apps","Endpoint","Identity","Office 365"],"ans":2,"exp":"Defender for Identity 偵測 AD 攻擊。","key":"","cat":"SC-900"},{"q":"Microsoft 365 E5 中跨端點、身份、郵件與應用程式的解決方案？","opts":["Cloud Apps","Endpoint","Office 365","Defender XDR"],"ans":3,"exp":"Defender XDR 是統一的延伸偵測與回應解決方案。","key":"","cat":"SC-900"},{"q":"使用 Microsoft Entra 特權身份管理（PIM）所需的 Microsoft Entra ID 最小版本是多少？","opts":["免費","Microsoft Entra 外部ID","Microsoft Entra ID P1","Microsoft Entra ID P2"],"ans":3,"exp":"Microsoft Entra ID P2 是唯一支援 PIM 的版本，提供即時存取、核准工作流程與時間限制的角色指派，符合最小權限原則。","key":"","cat":"SC-900"},{"q":"Microsoft Entra 在登入時有哪兩種認證方式可用？","opts":["密碼","基於簡訊的認證","安全問題","駕照","致電 Microsoft 客服中心"],"ans":[0,1],"exp":"密碼是最常見的登入方式，Microsoft Entra 支援此方法。簡訊驗證也能作為主要登入方式。安全問題不會用於登入；駕照並非身份驗證方法；致電客服中心不是有效的登入方式。","key":"","cat":"SC-900"},{"q":"為了啟用使用者自助密碼重設（SSPR），應該執行哪三個步驟？","opts":["指派一個 Microsoft Entra ID 授權","啟用使用者的 SSPR","註冊一種認證方式","註冊一個 Microsoft 帳號","建立自訂的封禁密碼清單"],"ans":[0,1,2],"exp":"要使用 SSPR，必須由管理員為使用者指派支援 SSPR 的 Microsoft Entra ID 授權，並啟用 SSPR，最後使用者需註冊至少一種認證方式。建議註冊兩種以上方法以避免單一方法不可用時無法重設。註冊 Microsoft 帳號或建立封禁密碼清單並非啟用 SSPR 的必要步驟。","key":"","cat":"SC-900"},{"q":"當使用者存取註冊在 Microsoft Entra 租戶中的應用程式時，可以用什麼來強制多重身份驗證（MFA）？","opts":["密碼雜湊同步","條件式存取","基於角色的存取控制（RBAC）","一個網路安全群組（NSG）"],"ans":1,"exp":"Conditional Access（條件式存取） 可以根據特定條件（例如存取某個應用程式）來強制執行 MFA。密碼雜湊同步只是讓 AD 密碼與 Entra 同步；RBAC 用於授權而非驗證；NSG 則是用於網路流量規則，與 MFA 無關。","key":"","cat":"SC-900"},{"q":"有什麼方法可以在不阻止使用者登入的情況下，接收可能被入侵的用戶帳號警報？","opts":["即時登入風險偵測","使用者風險","應用訊號","雲端應用程式或動作"],"ans":1,"exp":"User Risk（使用者風險） 代表某個帳號被入侵的可能性，可以設定為高、中、低等級。管理員能夠在不影響使用者登入的情況下，收到相關警報並採取後續措施。登入風險則是針對特定登入嘗試的風險評估；應用訊號與雲端應用程式動作並非用來偵測帳號入侵。","key":"","cat":"SC-900"},{"q":"Microsoft Entra 角色基礎存取控制（RBAC）與 Azure RBAC 有什麼不同？","opts":["Microsoft Entra 角色控制對使用者、群組及應用程式等資源的存取。Azure 角色控制資源存取，例如虛擬機。","Microsoft Entra 角色控制資源存取，例如虛擬機。Azure 角色控制資源的存取，例如使用者、群組和應用程式。","擁有 Microsoft Entra 角色的使用者可以進行購買和管理訂閱。擁有 Azure 角色的使用者可以使用 Microsoft Entra 中的所有管理功能。","擁有 Microsoft Entra 角色的使用者可使用 Microsoft Entra 中的所有管理功能。擁有 Azure 角色的使用者可以進行購買和管理訂閱。"],"ans":0,"exp":"Microsoft Entra RBAC 控制的是 Microsoft Entra 資源（如使用者、群組、應用程式）的存取，而 Azure RBAC 控制的是 Azure 資源（如虛擬機、儲存體）的存取。兩者都屬於 RBAC，但管理的範疇不同。","key":"","cat":"SC-900"},{"q":"Microsoft Entra 的最低版本是多少，可以讓你為使用者建立存取套件？","opts":["免費","Microsoft Entra 外部ID","Microsoft Entra ID P1","Microsoft Entra ID P2"],"ans":3,"exp":"Microsoft Entra ID P2 支援 權限管理 (Entitlement Management)，此功能能建立存取套件並透過自動化流程管理使用者對資源的存取。免費版與外部 ID 不支援此功能；P1 雖然提供基礎治理，但不包含存取套件。","key":"","cat":"SC-900"},{"q":"哪三個功能能降低惡意使用者存取敏感資源或授權使用者無意中影響敏感資源的機率？","opts":["Microsoft Defender for Cloud","Microsoft Entra ID Protection","Microsoft Entra 特權身份管理","Microsoft Sentinel","基於角色的存取控制（RBAC）"],"ans":[1,2,4],"exp":"Microsoft Entra Identity Protection 利用安全訊號偵測潛在威脅，降低帳號遭入侵風險。Privileged Identity Management (PIM) 提供即時存取與核准工作流程，減少過度或誤用的存取權限。RBAC 則透過角色控制資源存取，避免未授權或不必要的操作。Defender for Cloud 與 Sentinel 雖然是安全工具，但不直接用於降低使用者存取敏感資源的風險。","key":"","cat":"SC-900"},{"q":"你有一個 Microsoft Entra 租戶。你需要授權有時間限制的行政職務存取權限。你應該用什麼？","opts":["Microsoft Entra 存取套件","Microsoft Entra 存取評測","Microsoft Entra Conditional Access","特權身份管理（PIM）"],"ans":3,"exp":"Privileged Identity Management (PIM) 提供即時 (JIT) 與時間限制的管理員角色存取，並支援核准工作流程，確保符合最小權限原則。存取評測 (Access Reviews) 用於定期檢查使用者存取權限；Conditional Access 是零信任政策引擎，主要用於即時存取決策；存取套件則是權限管理的一部分，用來打包資源存取，但不專門用於時間限制的管理員角色授權。","key":"","cat":"SC-900"},{"q":"你有一個 Microsoft Entra 租戶。你需要建立一個存取套件。你應該用什麼？","opts":["Microsoft Defender for Identity","Microsoft Entra 存取審查","Microsoft Entra ID 治理","Microsoft Entra ID Protection"],"ans":2,"exp":"Microsoft Entra ID Governance 提供身份生命週期管理、存取審查、權限管理與存取套件等功能。Identity Protection 著重於偵測與回應身份風險；存取審查是治理的一部分，但不是建立存取套件的工具；Defender for Identity 偵測身份威脅，而非管理存取治理。","key":"","cat":"SC-900"},{"q":"要在 Azure 中實作網路分段，您必須建立 [答案選擇]。","opts":["堡壘主辦單位","防火牆","安全群組","虛擬網路"],"ans":3,"exp":"Virtual Network（虛擬網路） 是 Azure 中實作網路分段的核心元件。它能隔離並組織資源，支援治理與安全策略。防火牆可用於控制不同網路間的存取；Bastion 主機提供安全的 RDP/SSH 存取；安全群組則是用於簡化資源存取管理，但不是網路分段的主要方式。","key":"","cat":"SC-900"},{"q":"安全資訊與事件管理（SIEM）解決方案的兩個特點是什麼？","opts":["從 IT 資產收集資料","資料相關性","行動驅動的工作流程","問題緩解"],"ans":[0,1],"exp":"SIEM 系統的核心特點是能夠從 IT 資產收集大量安全資料，並進行 資料相關性 (Correlation)，將不同來源的事件整合分析以偵測潛在威脅。行動驅動的工作流程與問題緩解則屬於 SOAR 系統的特性。","key":"","cat":"SC-900"},{"q":"安全協調自動回應（SOAR）解決方案包含哪兩個特性？","opts":["從 IT 資產收集資料","資料相關性","行動驅動的工作流程","問題緩解"],"ans":[2,3],"exp":"SOAR 系統的特性在於能建立 行動驅動的工作流程，自動化安全事件的回應，並且提供 問題緩解，協助快速處理與降低安全事件的影響。資料收集與相關性分析則是 SIEM 系統的特性。","key":"","cat":"SC-900"},{"q":"哪一項功能只在 Microsoft Defender for Office 365 Plan 2 中可用？","opts":["攻擊模擬訓練","安全連結","防網釣魚保護","即時偵測"],"ans":0,"exp":"Attack Simulator 僅在 Defender for Office 365 Plan 2 提供，能模擬釣魚或密碼攻擊以測試使用者防禦能力。安全連結、防網釣魚保護與即時偵測則在 Plan 1 就已提供。","key":"","cat":"SC-900"},{"q":"哪個 Microsoft Defender for Endpoint 功能規範了對惡意 IP 位址、網域和網址的存取？","opts":["威脅與漏洞管理","攻擊面縮減（ASR）","自動化調查與整治（AIR）","Microsoft 威脅專家"],"ans":1,"exp":"ASR (Attack Surface Reduction) 規範並限制對惡意 IP 位址、網域和網址的存取，降低攻擊面。AIR 則透過 Playbooks 自動分析警示並採取行動；Microsoft 威脅專家提供 SOC 支援；威脅與漏洞管理則專注於掃描漏洞與錯誤設定。","key":"","cat":"SC-900"},{"q":"在哪裡可以找到 Microsoft 雲端服務的獨立稽核報告與評估？","opts":["Microsoft 服務信任入口網站","Microsoft 雲端帳戶管理員","https://privacy.microsoft.com/","https://portal.azure.com/"],"ans":0,"exp":"Service Trust Portal 提供 Microsoft 安全性、隱私與合規性相關的資訊、工具與資源。獨立稽核報告與評估文件最佳的取得方式就是透過 Service Trust Portal。Azure 入口主要用於資源管理；privacy.microsoft.com 提供隱私政策；雲端帳戶管理員並不提供稽核報告。","key":"","cat":"SC-900"},{"q":"你有 Microsoft 365 E5 訂閱。你需要取得公司所需的通訊合規解決方案。你應該用什麼？","opts":["Microsoft 365 管理中心","Microsoft Defender 入口網站","Microsoft Entra 管理中心","Microsoft Purview 入口網站"],"ans":3,"exp":"Microsoft Purview 入口網站是集中化的介面，用來存取合規與風險解決方案，例如 Compliance Manager、eDiscovery、Audit、Communication Compliance、Data Loss Prevention，以及 Insider Risk Management。Defender 入口網站主要用於安全營運與威脅防護；Entra 管理中心則專注於身份與存取管理；Microsoft 365 管理中心則是租戶層級的服務管理介面，但並非專門的合規解決方案入口。","key":"","cat":"SC-900"},{"q":"你在哪裡可以存取並檢視掃描物品的敏感檔案快照？","opts":["Microsoft Purview 入口網站","Microsoft Defender for Cloud portal","Microsoft Entra 管理中心","Microsoft Intune 管理中心"],"ans":0,"exp":"Purview 入口網站能讓管理員存取並檢視掃描來源內容的敏感檔案快照，例如 Exchange、SharePoint、OneDrive，並透過 Compliance Manager 檢閱。","key":"","cat":"SC-900"},{"q":"哪種安全模型採用分層式的安全方法，提供機制在每層邊緣阻止入侵？","opts":["縱深防禦","PCI DSS 合規","共同責任","零信任"],"ans":0,"exp":"Defense in Depth 採用分層式安全方法，在每層邊緣提供防護機制。","key":"","cat":"SC-900"},{"q":"哪家身份提供者能讓你在 Azure 中使用 SaaS 和 PaaS，且管理工作量最少？","opts":["Active Directory","Microsoft Entra ID","Google 身份","Facebook 身份"],"ans":1,"exp":"Entra ID 可直接用於 Azure SaaS 與 PaaS，不需額外網域控制器伺服器。","key":"","cat":"SC-900"},{"q":"作為主要安全邊界模型的身份，有哪兩個特徵？","opts":["SaaS 應用可託管於企業網路之外","只有企業設備能完成企業任務","BYOD 可用於完成企業任務","SaaS 應用無法在企業網路之外託管"],"ans":[0,2],"exp":"在「身份作為主要安全邊界」模型中，SaaS 應用可託管於企業網路之外，且允許 BYOD 完成企業任務。","key":"","cat":"SC-900"},{"q":"一個組織正在遷移到 Microsoft 雲端。計畫是採用混合身份模型。有什麼可以用來同步 Active Directory 網域服務（AD DS）與 Microsoft Entra 租戶之間的身份？","opts":["Active Directory 聯邦服務（AD FS）","Microsoft Sentinel","Microsoft Entra Connect Sync","Microsoft Entra 特權身份管理"],"ans":2,"exp":"Microsoft Entra Connect Sync 專為混合身份模型設計，能同步 AD DS 與 Entra 租戶的身份。AD FS 是同盟服務，不適用於混合身份同步；Sentinel 是安全監控產品，與身份無關；PIM 用於管理與監控特權存取，而不是同步身份。","key":"","cat":"SC-900"},{"q":"Microsoft Entra 中最不被授權的角色是什麼，可以用來建立和管理使用者與群組？","opts":["全球管理員","安全管理員","使用者管理員","Teams 管理員"],"ans":2,"exp":"User Administrator 能建立與管理使用者和群組，是最不具特權的角色。Global Administrator 雖然也能管理使用者與群組，但權限過大；Security Administrator 著重於安全設定；Teams Administrator 則專注於 Teams 服務管理。","key":"","cat":"SC-900"},{"q":"你有一個 Microsoft Entra 租戶。你需要確保被分配為管理員角色的使用者遵循最小權限原則，透過即時存取與核准工作流程。你應該用什麼？","opts":["Microsoft Defender for Identity","Microsoft Entra ID 治理","Microsoft Entra ID Protection","特權身份管理（PIM）"],"ans":3,"exp":"PIM 提供即時 (JIT) 角色啟用、核准工作流程、時間限制的角色指派，以及存取審查，確保最小權限原則。","key":"","cat":"SC-900"},{"q":"Microsoft Purview 資訊保護與資料生命週期管理協同運作，以[回答選擇]資料。","opts":["分類、保護與治理","分類、保護與備份","探索、保護與分享","探索、保護與後退"],"ans":0,"exp":"資訊保護與資料生命週期管理協同運作，能 分類、保護與治理 資料，確保合規與安全。","key":"","cat":"SC-900"},{"q":"您可以透過在 Microsoft Purview 中使用 [Target_A]，確保資料被保留至指定期間，然後永久刪除。","opts":["DLP 政策","電子發現案件","留任政策","敏感度標籤"],"ans":2,"exp":"Retention Policies 能保留資料至指定期間並自動刪除，符合法規與紀錄管理需求。","key":"","cat":"SC-900"},{"q":"在敏感標籤政策中，如何確保 Label1 自動套用到所有 Exchange Online 郵件？","opts":["對外部郵件套用加密","預設將 Label1 套用到 Exchange Online 郵件","指派權利管理擁有者","自動替換相同或較低優先權標籤"],"ans":1,"exp":"在政策中設定 預設標籤 為 Label1，即可確保所有收發郵件自動套用。","key":"","cat":"SC-900"},{"q":"哪一種陳述描述網路安全群組（NSG）？","opts":["提供網路層流量過濾功能，限制流量至虛擬網路資源","保護網頁應用程式免受漏洞攻擊","提供集中式防火牆即服務","僅鎖定進站流量"],"ans":0,"exp":"NSG 提供分散式網路層流量過濾，限制流量至虛擬網路資源。","key":"","cat":"SC-900"},{"q":"Azure 中 NSG 規則：AllowVNetInBound (65000)、AllowAzureLoadBalancerInBound (65001)、DenyAllInBound (65500)。規則處理順序？","opts":["AllowVNetInBound → AllowAzureLoadBalancerInBound → DenyAllInBound","DenyAllInBound → AllowAzureLoadBalancerInBound → AllowVNetInBound","AllowAzureLoadBalancerInBound → AllowVNetInBound → DenyAllInBound","DenyAllInBound → AllowVNetInBound → AllowVNetInBound"],"ans":0,"exp":"NSG 規則依優先權數值由小到大處理，因此順序為 65000 → 65001 → 65500。","key":"","cat":"SC-900"},{"q":"[答案選擇] 可用來將 Azure 安全基準的指引套用到 Microsoft Entra 等服務。","opts":["安全基線","Microsoft Sentinel","Microsoft Purview","合規政策"],"ans":0,"exp":"Security Baselines 能將 Azure 安全基準的指引套用到特定服務，提供一致的安全體驗。","key":"","cat":"SC-900"},{"q":"SIEM 解決方案的兩個特點是什麼？","opts":["從 IT 資產收集資料","資料相關性","行動驅動的工作流程","問題緩解"],"ans":[0,1],"exp":"SIEM 特點：集中收集 IT 資產資料，並進行 資料相關性分析。行動驅動與問題緩解屬於 SOAR 特性。","key":"","cat":"SC-900"},{"q":"Microsoft Sentinel 包含哪兩種安全系統？","opts":["DLP","SIEM","SOAR","EPP"],"ans":[1,2],"exp":"Sentinel 是 SIEM + SOAR 的結合，提供事件管理與自動化回應。","key":"","cat":"SC-900"},{"q":"在 Microsoft Sentinel 中調查安全事件並檢視完整活動時間軸，應該複習什麼？","opts":["書籤","戰術手冊","警報","事件"],"ans":3,"exp":"Incident 整合相關警報，提供集中檢視與完整調查時間軸。","key":"","cat":"SC-900"},{"q":"哪些元件可以使用 Microsoft Defender XDR 保護？","opts":["端點、身份、硬碟與交換器","端點、身份、電子郵件與應用程式","電子郵件、應用程式、路由器與交換器","硬碟、交換器、電子郵件與應用程式"],"ans":1,"exp":"Defender XDR 可保護端點、身份、電子郵件與應用程式，無法保護實體設備。","key":"","cat":"SC-900"},{"q":"Microsoft Defender for Cloud Apps 中哪一項功能用來從活動日誌擷取資料？","opts":["雲端探索","應用程式連接器","政策","雲端應用程式目錄"],"ans":1,"exp":"App Connectors 從雲端應用程式活動日誌擷取資料。Policies 偵測風險；Catalog 用於核准/不核准；Cloud Discovery 用於識別雲端環境。","key":"","cat":"SC-900"},{"q":"哪款 Microsoft 解決方案能讓你符合 GDPR 與 PCI 的合規標準？","opts":["Microsoft Defender for Cloud Apps","Microsoft Defender for Identity","Microsoft Defender for Cloud","Microsoft Defender for Office 365"],"ans":0,"exp":"Defender for Cloud Apps 是 CASB，支援多種部署模式，能協助符合 GDPR 與 PCI。","key":"","cat":"SC-900"},{"q":"CASB 的四大支柱是什麼？","opts":["控制、合規、平台安全與治理","發現、保護、可存取的雲端應用程式，以及平台安全","可見性、合規性、資料安全與平台安全","可視性、合規性、資料安全與威脅防護"],"ans":3,"exp":"CASB 四大支柱：可視性、合規性、資料安全、威脅防護。","key":"","cat":"SC-900"},{"q":"哪種安全模型假設一切都是開放且不可信的網路？","opts":["共同責任","縱深防禦","零信任","PCI DSS 合規"],"ans":2,"exp":"Zero Trust 假設所有網路不可信，並採「假設已遭入侵」思維。","key":"","cat":"SC-900"},{"q":"身份基礎架構的哪一支柱負責定義使用者存取權限？","opts":["行政","認證","授權","審計"],"ans":2,"exp":"Authorization 決定已認證使用者能存取哪些資源及層級。","key":"","cat":"SC-900"},{"q":"身份作為主要安全邊界模型的兩個特徵是什麼？","opts":["SaaS 應用可託管於企業網路之外","只有企業設備能完成任務","BYOD 可用於完成企業任務","SaaS 應用無法在企業網路之外託管"],"ans":[0,2],"exp":"Identity as the perimeter：SaaS 可在企業網路外託管，BYOD 可用於企業任務。","key":"","cat":"SC-900"},{"q":"Microsoft Entra ID 提供哪些功能？","opts":["使用者的單一登入 (SSO)","深層防禦","靜態資料加密","傳輸中資料加密"],"ans":0,"exp":"Microsoft Entra ID 提供 SSO。Microsoft Entra ID 提供聯合身分驗證。Microsoft Entra 是深度防禦的一環。Microsoft Entra ID 不提供檔案服務，也不提供傳輸中資料加密功能。","key":"","cat":"SC-900"},{"q":"您需要允許外部使用者使用 Azure 訂閱中裝載的共享資源。您規劃使用每月活躍使用者 (MAU) 計費。您需要確定每月不會向您收取前 50,000 個 MAU 的費用。您可以使用的最低 Microsoft Entra ID 版本為何？","opts":["免費","Microsoft Entra 外部 ID","Microsoft Entra ID P1","Microsoft Entra ID P2"],"ans":2,"exp":"MAU 計費可用於所有 Microsoft 使用者，但 Microsoft Entra ID P1 和 P2 均不對每月前 50,000 個 MAU 收費。Microsoft Entra ID P1 是允許使用此功能的最低版本。免費和 Microsoft Entra External ID 會按使用者產生費用，且不提供前 50,000 個 MAU 免費權益。","key":"","cat":"SC-900"},{"q":"哪一項 Microsoft Entra 功能允許您使用內部部署 Active Directory 網域對使用者進行身分驗證，而無需連接到內部部署網域控制器？","opts":["密碼雜湊同步","傳遞驗證","同盟驗證","Microsoft Entra 權限身分識別管理"],"ans":0,"exp":"密碼雜湊同步會在 Active Directory 和 Microsoft Entra 之間同步密碼（雜湊的雜湊）。傳遞驗證需要在內部部署環境中進行驗證。同盟驗證需要在內部部署環境中進行驗證。提高權限時，使用 PIM 進行驗證。","key":"","cat":"SC-900"},{"q":"組織正在移轉至 Microsoft 雲端。此計畫是使用混合式身分識別模型。何種功能可用於在 Active Directory 網域服務 (AD DS) 和 Microsoft Entra 使用者之間同步身分？","opts":["Active Directory 同盟服務（AD FS）","Microsoft Sentinel","Microsoft Entra Connect Sync","Microsoft Entra 特殊許可權身分識別管理"],"ans":2,"exp":"Microsoft Entra Connect 的設計目的是符合並完成混合式身分識別的目標。AD FS 不能用於身分同步。Microsoft Sentinel 不是身分識別產品。PIM 用於管理和監視重要資源的存取。","key":"","cat":"SC-900"},{"q":"您可以使用何種功能，防止使用者將組織名稱或組織產品名稱用做 Microsoft Entra ID 中的密碼？","opts":["全域禁用密碼清單","Microsoft Entra 身分識別保護","Microsoft Entra 密碼保護","多重身份驗證（MFA）"],"ans":2,"exp":"全域禁用密碼清單不會涵蓋您自己的組織和產品名稱。Microsoft Entra 密碼保護提供針對密碼噴灑攻擊的保護。MFA 不會管理密碼內容。","key":"","cat":"SC-900"},{"q":"使用者可以使用哪些三樣東西來進行 Microsoft Entra 多重驗證（MFA）？每個正確答案都提供完整的解決方案。","opts":["申請人知道的內容","申請人擁有的東西","代表申請人身分的事物","申請人不能重複使用的某些東西","申請人需要解決的問題"],"ans":[0,1,2],"exp":"Microsoft Entra MFA 的工作原理是要求您知道的資訊（例如密碼）、您擁有的資訊（例如電話）或您的身分資訊（生物識別技術）。","key":"","cat":"SC-900"},{"q":"當使用者無法登入其裝置或應用程式時，哪一項 Microsoft Entra 功能有助於減少技術支援中心呼叫和生產力損失？","opts":["自助式密碼重設 (SSPR)","身分識別保護","條件式存取","Microsoft Entra 密碼保護"],"ans":0,"exp":"SSPR 是 Microsoft Entra 的功能，可讓使用者變更或重設其密碼，而不需要管理員或技術支援中心介入。若未啟用 SSPR，身分識別保護就無法提供所要求的解決方案。條件式存取會整合訊號來制定決策與強制執行原則。Microsoft Entra 密碼保護可降低使用者設定弱密碼時的風險。","key":"","cat":"SC-900"},{"q":"當使用者存取註冊在 Microsoft Entra 租戶中的應用程式時，可以用什麼來強制多重身份驗證（MFA）？","opts":["密碼雜湊同步","條件式存取","角色型存取控制 (RBAC)","網路安全性群組 (NSG)"],"ans":1,"exp":"條件式存取可以根據條件（例如存取應用程式）來強制執行 MFA。密碼雜湊同步用來同步密碼。RBAC 提供授權，而不是驗證。NSG 則提供網路存取規則。","key":"","cat":"SC-900"},{"q":"您可以在條件式存取原則中使用哪個條件來評估使用者帳戶遭到入侵的可能性？","opts":["位置","裝置狀態","使用者風險","登入風險"],"ans":2,"exp":"使用者風險可以評估使用者帳戶遭到入侵的可能性。登入風險可以識別登入嘗試是否為高風險，例如從遭入侵的 IP 位址登入。裝置狀態會驗證裝置平台。位置則與特定 IP 網路相關聯。","key":"","cat":"SC-900"},{"q":"哪兩個訊號可以用作條件式存取的一部分？每個正確答案都代表解決方案的一部分。","opts":["群組成員資格","裝置平台","密碼長度","電話號碼"],"ans":[0,1],"exp":"條件式存取訊號包括使用者或群組成員身分、具名位置資訊、應用程式、即時登入風險偵測、雲端應用程式或操作以及使用者風險。密碼長度與電話號碼不屬於條件式存取訊號。","key":"","cat":"SC-900"},{"q":"您可以使用什麼項目來接收潛在遭入侵使用者帳戶的警示，而不會封鎖使用者登入？","opts":["即時登入風險偵測","使用者風險","應用程式訊號","雲端應用程式或動作"],"ans":1,"exp":"使用者風險代表特定的身分識別或帳戶遭入侵的可能性。可以將使用者風險設定為高、中或低可能性。管理員可以設定此訊號，而不中斷使用者登入。","key":"","cat":"SC-900"},{"q":"允許您為使用者建立存取套件的 Microsoft Entra 的最低版本為何？","opts":["免費","Microsoft Entra 外部 ID","Microsoft Entra ID P1","Microsoft Entra ID P2"],"ans":3,"exp":"Microsoft Entra ID P2 允許使用權利管理（Entitlement Management），從而啟用存取套件（Access Packages）。","key":"","cat":"SC-900"},{"q":"你有一個 Microsoft Entra 租戶。你需要對管理角色授予有時間限制的存取權限。您應該使用什麼？","opts":["Microsoft Entra 存取套件","Microsoft Entra Access 評測","Microsoft Entra 條件式存取","Privileged Identity Management（PIM）"],"ans":3,"exp":"PIM 管理即時存取（JIT）及限時存取的管理角色。存取審查有助於驗證持續存取，但不提供結構化存取請求工作流程。條件存取是零信任政策引擎。存取套件屬於權利管理功能。","key":"","cat":"SC-900"},{"q":"你有一個 Microsoft Entra 租戶。你需要確保被分配為管理員角色的使用者遵循最小權限原則，透過即時存取與核准工作流程。您應該使用什麼？","opts":["適用於身分識別的 Microsoft Defender","Microsoft Entra ID 控管","Microsoft Entra 身分識別保護","Privileged Identity Management（PIM）"],"ans":3,"exp":"PIM 支援 JIT 角色啟動、核准工作流程、限時指派及存取審查，支援管理角色的最小權限原則。","key":"","cat":"SC-900"},{"q":"什麼是分散式阻斷服務 (DDoS) 攻擊類型？","opts":["密碼噴灑、通訊協定攻擊和中間人 (MITM) 攻擊","密碼噴灑、字典攻擊和資源層攻擊","資源層攻擊、通訊協定攻擊和大量攻擊","字典攻擊、中間人 (MITM) 攻擊和流量型攻擊"],"ans":2,"exp":"DDoS 最常見的三種類型為 Resource Layer Attack、Protocol Attack 以及 Volumetric Attack。密碼噴灑、字典攻擊與 MITM 並非 DDoS 攻擊。","key":"","cat":"SC-900"},{"q":"哪個 Azure 功能提供應用程式層級篩選和 SSL 終止？","opts":["分散式阻斷服務 (DDoS) 保護","Azure 防火牆","Azure Web 應用程式防火牆 (WAF)","Azure Bastion 主機"],"ans":2,"exp":"Azure WAF 提供應用程式層級保護、流量篩選及 SSL/TLS 終止功能。DDoS 保護不提供篩選；Azure Firewall 不提供 SSL 終止；Bastion 提供遠端連線功能。","key":"","cat":"SC-900"},{"q":"您可以在 Azure 中使用什麼項目來實作部門型網路分割？","opts":["虛擬網路","虛擬私人網路","Azure Bastion","Azure Private Link"],"ans":0,"exp":"虛擬網路（VNet）可實作網路分割，將工作負載與部門資源隔離，符合治理與安全需求。VPN 主要用於連線網路而非分割網路。","key":"","cat":"SC-900"},{"q":"您可以使用什麼項目從 Azure 入口網站透過 RDP 和 SSH 從遠端連線到 Azure 虛擬機器？","opts":["Azure Web 應用程式防火牆 (WAF)","Microsoft Entra 身分識別保護","適用於雲端的 Microsoft Defender","Azure Bastion"],"ans":3,"exp":"Bastion 是可在 Azure 虛擬網路中部署的 PaaS 服務，可透過瀏覽器與 Azure 入口網站安全地使用 RDP 或 SSH 連線至虛擬機器。","key":"","cat":"SC-900"},{"q":"哪個 Azure 服務可集中保護 Web 應用程式，使其免於遭遇常見的惡意探索和弱點？","opts":["Azure Key Vault","Azure Web 應用程式防火牆 (WAF)","Microsoft Entra 身分識別保護","適用於雲端的 Microsoft Defender"],"ans":1,"exp":"Azure WAF 可集中保護 Web 應用程式，避免常見攻擊與漏洞利用。Key Vault 用於祕密管理；Identity Protection 用於身分保護；Defender for Cloud 則提供安全態勢管理。","key":"","cat":"SC-900"},{"q":"哪個服務可讓您持續評估安全性態勢、身分識別威脅，以及強化 Azure 和內部部署工作負載中的資源？","opts":["Azure 防火牆","適用於雲端的 Microsoft Defender","Azure Web 應用程式防火牆 (WAF)","Microsoft Purview"],"ans":1,"exp":"適用於雲端的 Microsoft Defender 可持續評估安全態勢、偵測威脅並提供強化建議，涵蓋 Azure、混合式雲端及內部部署環境。","key":"","cat":"SC-900"},{"q":"你可以從 [Target_A] 啟用 Microsoft Defender for Servers 方案。","opts":["適用於雲端的 Microsoft Defender","適用於端點的 Microsoft Defender","適用於身分識別的 Microsoft Defender","適用於 Office 365 的 Microsoft Defender"],"ans":0,"exp":"你可以在 Defender for Cloud 的 Defender for Servers 方案中啟用。這是透過 Azure 入口網站的環境設定選項來完成，適用於 Azure 訂閱、AWS 帳戶或 GCP 專案。Defender for Servers Plan 1 或 Plan 2 可保護雲端及本地虛擬機器。","key":"","cat":"SC-900"},{"q":"哪兩個特性是安全性協調流程自動化回應 (SOAR) 解決方案的一部分？","opts":["從 IT 環境收集資料","資料相互關聯","動作驅動工作流程","問題緩解"],"ans":[2,3],"exp":"動作驅動工作流程和問題風險降低是由 SOAR 系統所完成。從 IT 環境收集資料與資料相互關聯屬於 SIEM 的核心功能。","key":"","cat":"SC-900"},{"q":"哪兩種類型的安全性系統組成 Microsoft Sentinel？","opts":["資料外洩防護 (DLP)","安全性資訊與事件管理 (SIEM)","安全性編排自動化回應 (SOAR)","端點保護平台 (EPP)"],"ans":[1,2],"exp":"Microsoft Sentinel 是 SIEM 與 SOAR 系統的混合，可同時提供威脅偵測、事件分析與自動化回應。","key":"","cat":"SC-900"},{"q":"您具有 Microsoft Sentinel 工作區。你需要調查安全事件，並檢視所有相關的警示、實體以及與該事件相關的完整活動時間軸。你應該複習哪些內容？","opts":["書籤","操作手冊","警報","事故"],"ans":3,"exp":"Microsoft Sentinel 的事件（Incident）會將相關警示分組，並提供包含相關實體及調查時間軸的集中視圖，讓分析師能完整調查安全事件。","key":"","cat":"SC-900"},{"q":"哪些元件可以使用 Microsoft Defender XDR 來保護？","opts":["端點、身分識別、硬碟和交換器","端點、身分識別、電子郵件和應用程式","電子郵件、應用程式、路由器和交換器","硬碟、交換器、電子郵件和應用程式"],"ans":1,"exp":"Microsoft Defender XDR（原 Microsoft 365 Defender）可保護端點、身分識別、電子郵件、協作工具及雲端應用程式。","key":"","cat":"SC-900"},{"q":"適用於 Office 365 的 Microsoft Defender 方案 2 中僅提供哪個功能？","opts":["攻擊模擬訓練","安全連結","反網路釣魚防護","即時偵測"],"ans":0,"exp":"只有 Microsoft Defender for Office 365 Plan 2 提供 Attack Simulation Training（攻擊模擬訓練）功能。","key":"","cat":"SC-900"},{"q":"哪個適用於端點的 Microsoft Defender 功能可規範惡意 IP 位址、網域和 URL 的存取？","opts":["威脅與弱點管理","攻擊面縮減 (ASR)","自動化調查與補救 (AIR)","Microsoft 威脅專家"],"ans":1,"exp":"ASR 可處理對惡意端點、網域及 URL 的存取限制，以降低攻擊面。","key":"","cat":"SC-900"},{"q":"哪款 Microsoft Defender XDR 解決方案能防範惡意電子郵件威脅？","opts":["適用於 Office 365 的 Microsoft Defender","Microsoft Defender 端點版","適用於身分識別的 Microsoft Defender","Microsoft Defender for Cloud Apps"],"ans":0,"exp":"可保護組織免於電子郵件訊息、惡意 URL 和協作工具（Teams、SharePoint、OneDrive 等）所帶來的威脅。","key":"","cat":"SC-900"},{"q":"使用 Microsoft Defender XDR 會保護哪三個元件？","opts":["身分識別","端點","應用程式","分析","行動裝置"],"ans":[0,1,2],"exp":"Defender XDR 使用 Defender for Identity、Defender for Endpoint、Defender for Cloud Apps 與 Defender for Office 365 提供整合防護。","key":"","cat":"SC-900"},{"q":"你可以在 Microsoft Defender 中設定 Honeytoken 標籤 [Target_A]。","opts":["雲端應用程式","端點","身分識別","Office 365"],"ans":2,"exp":"Honeytoken 功能位於 Defender for Identity，可標記誘捕帳號來偵測惡意活動與橫向移動。","key":"","cat":"SC-900"},{"q":"你有一個混合環境，包含一個 Active Directory Domain Services（AD DS）網域。你需要保護你的組織免受憑證竊取、橫向移動及權限升級攻擊。在 Microsoft Defender XDR 中應該使用什麼？","opts":["Microsoft Defender for Cloud Apps（Microsoft 雲端應用程式防護）","Microsoft Defender 端點版","適用於身分識別的 Microsoft Defender","適用於 Office 365 的 Microsoft Defender"],"ans":2,"exp":"Defender for Identity 監控本地 Active Directory 訊號，以偵測基於身份的威脅，例如憑證竊取、橫向移動及權限提升。Defender for Cloud Apps 著重於雲端應用程式的可視化與控制。Defender for Endpoint 保護裝置與伺服器。Defender for Office 365 保護電子郵件與協作工作負載。","key":"","cat":"SC-900"},{"q":"哪種加密方法會使用相同的金鑰來加密和解密資料？","opts":["對稱加密","非對稱加密","雜湊"],"ans":0,"exp":"對稱加密使用相同的金鑰來加密和解密資料。非對稱加密使用公開金鑰和私密金鑰組。雜湊會將文字轉換成固定長度值。","key":"","cat":"SC-900"},{"q":"哪種加密方法會使用一組公開金鑰和私密金鑰？","opts":["對稱加密","共用金鑰","雜湊","非對稱加密"],"ans":3,"exp":"非對稱加密使用公開金鑰和私密金鑰組。公開或私密金鑰可以加密資料，但需以對應金鑰解密。","key":"","cat":"SC-900"},{"q":"與其他驗證方法相較之下，單一登入 (SSO) 的優點為何？","opts":["使用者可以存取其網域中的資源。","使用者只要驗證一次，就能在任何位置存取資源。","裝置可以由多個使用者共用。","裝置只能由單一使用者使用。"],"ans":1,"exp":"使用者只要驗證一次，就能在任何位置使用 SSO 存取資源。存取網域資源不等於 SSO。","key":"","cat":"SC-900"},{"q":"使用身分識別作為主要安全界限模型的兩個特性為何？","opts":["適用於商務關鍵性工作負載的 SaaS 應用程式可以會裝載在公司網路外部。","只有公司裝置才能用來完成公司工作。","自備裝置 (BYOD) 可以用來完成公司工作。","適用於商務關鍵性工作負載的 SaaS 應用程式無法裝載在公司網路外部。"],"ans":[0,2],"exp":"商務關鍵工作負載可裝載於公司網路外部，而 BYOD 可以用來完成公司工作。其他選項屬於傳統界限型安全模型。","key":"","cat":"SC-900"},{"q":"單一登入 (SSO) 的功能為何？","opts":["可讓使用者登入一次，然後就不需要再次登入","採用個別身分識別提供者","使用一個認證來存取多個應用程式或資源","由於中央化的目錄，不需要重設密碼。"],"ans":2,"exp":"SSO 可讓使用者使用單一認證登入並存取多個應用程式和資源。其無法確保永遠不需要再次登入。","key":"","cat":"SC-900"},{"q":"Active Directory Domain Services (AD DS) 的功能為何？","opts":["支援行動裝置","支援軟體即服務 (SaaS) 應用程式","利用每位使用者的單一身分識別來管理內部部署系統","管理需要新式驗證方法的企業營運（LOB）應用程式"],"ans":2,"exp":"AD DS 可讓您使用單一身分識別管理多個內部部署基礎結構元件與系統。","key":"","cat":"SC-900"},{"q":"哪個 Microsoft 隱私權準則定義加密金鑰的使用和管理？","opts":["透明度","安全性","控制項","強健的法律保護"],"ans":1,"exp":"安全性準則定義如何使用加密與金鑰管理。控制項代表客戶控制其資料；強健法律保護代表法律要求直接交由客戶處理；透明度代表說明資料使用方式。","key":"","cat":"SC-900"},{"q":"哪三個角色有權限登入 Microsoft Purview 入口網站？","opts":["全域管理員","合規性系統管理員","合規性資料管理員","使用者管理員","安全性檢視器"],"ans":[0,1,2],"exp":"具有 Microsoft 365 SKU 且具備全域管理員、合規性管理員或合規性資料管理員角色的使用者可以使用 Purview 入口網站。","key":"","cat":"SC-900"},{"q":"Microsoft 雲端服務會使用哪些類型的合規性管理員控制項？","opts":["客戶受控控制項","共用控制項","Microsoft 管理控制項","評量控制項"],"ans":2,"exp":"Microsoft Managed Controls 用於控制與保護 Microsoft 雲端服務本身。","key":"","cat":"SC-900"},{"q":"在 Microsoft Purview 中，哪種類型的原則可讓您防止在組織外部共用包含個人識別的文件？","opts":["敏感度標籤原則","保留原則","資料外洩防護 (DLP) 原則","Azure 原則"],"ans":2,"exp":"DLP 原則可用來處理資料外洩。敏感度標籤原則用來將標籤套用至文件。保留原則用來定義文件維護時間長度。Azure 原則用來判斷 Azure 服務的設定方式。","key":"","cat":"SC-900"},{"q":"在 Microsoft Purview 中，您可以使用什麼項目來將項目標示為法規記錄、維護項目刪除證明，以及匯出已處置項目的相關資訊？","opts":["保留標籤和保留標籤原則","保留原則","敏感性標籤和敏感性標籤原則","資料外洩防護 (DLP) 原則"],"ans":0,"exp":"這些是記錄管理的功能。敏感度標籤可讓我們標示項目。DLP 不會處理項目的處置。","key":"","cat":"SC-900"},{"q":"請選擇能正確完成句子的答案。Microsoft Purview 資訊保護和資料生命週期管理會搭配運作以 [答案選擇] 資料。","opts":["分類、保護和控管","分類、保護和備份","探索、保護和共用","探索、保護和備份"],"ans":0,"exp":"資訊保護與資料生命週期管理可共同運作，以分類、保護和治理資料。您無法透過 Microsoft Purview 共用資料。","key":"","cat":"SC-900"},{"q":"可以使用什麼項目來設定可啟用端對端資料譜系的統一資料治理服務？","opts":["Active Directory","適用於 SQL 的 Microsoft Defender","Microsoft Purview","Microsoft Intune"],"ans":2,"exp":"Microsoft Purview 是統一資料治理服務，可協助您管理與治理內部部署、多雲端和 SaaS 資料。可以用來設定統一資料治理服務並實現端對端資料譜系。","key":"","cat":"SC-900"},{"q":"你需要為公司中特定使用者保留信箱和檔案資料五年。您應該使用什麼？","opts":["Microsoft Defender for Cloud Apps","Microsoft Priva","Microsoft Purview 資料生命週期管理","Microsoft Purview 資料遺失防護（DLP）"],"ans":2,"exp":"資料生命週期管理提供保留政策與保留標籤，確保信箱與檔案資料在指定期間內被保留並依需求刪除，直接支援紀錄管理。","key":"","cat":"SC-900"},{"q":"你正在 Microsoft Purview 中設定敏感標籤政策。你需要確保一個名為 Label1 的特定敏感標籤會自動套用到所有 Microsoft Exchange Online 電子郵件訊息，包括收發和寄出的郵件。標籤政策中你應該採取哪些行動？","opts":["對來自組織外部的電子郵件套用加密。","預設將 Label1 套用到 Exchange Online 的電子郵件訊息。","指派一位權利管理擁有者。","自動替換優先權相同或較低的現有標籤。"],"ans":1,"exp":"預設對 Exchange Online 電子郵件套用 Label1，可確保所有郵件自動取得該敏感度標籤。","key":"","cat":"SC-900"},{"q":"在 Microsoft Purview 中，您可以使用什麼項目來偵測敏感性資料的潛在洩漏和智慧財產權竊取？","opts":["資料生命週期管理","eDiscovery","資訊保護","內部風險管理"],"ans":3,"exp":"內部風險管理可協助將敏感性資料洩漏、資料外洩、機密性違規、智慧財產權竊取、詐騙及法規遵循違規的風險降到最低。","key":"","cat":"SC-900"},{"q":"在 Microsoft Purview 內部風險管理中，應該為需要進一步調查的電子發現內容建立什麼？","opts":["案例","原則","標籤"],"ans":0,"exp":"警示必須進行分級，而需要進一步調查的警示應新增至案例。每個案例都與一個使用者相關聯，且可能包含多個警示。","key":"","cat":"SC-900"},{"q":"在 Microsoft Purview 中，可以使用什麼項目來調查可能的安全性或合規性缺口，並根據記錄來識別其範圍？","opts":["稽核 (進階版)","內容搜尋","eDiscovery","合規性管理員"],"ans":0,"exp":"稽核（進階版）可用來調查可能的安全性或合規性缺口，並根據稽核記錄確認影響範圍。","key":"","cat":"SC-900"},{"q":"哪個項目可以協助您識別合規性稽核所需的文件？","opts":["Microsoft 服務信任入口網站","Microsoft Purview 合規性管理員","Microsoft Purview 通訊合規性","Microsoft Purview 電子發現"],"ans":3,"exp":"電子資訊探索（eDiscovery）是識別和交付可作為法律或稽核證據之電子資訊的流程，可協助識別合規性稽核所需文件。","key":"","cat":"SC-900"},{"q":"您應該使用什麼項目以將密碼儲存為受保護格式？","opts":["對稱加密","非對稱加密","雜湊","對稱與非對稱式加密的組合"],"ans":2,"exp":"雜湊是密碼加密的最佳選項。非對稱加密和對稱加密都允許解密，但對於密碼來說，這並不是您想要的特性。","key":"","cat":"SC-900"},{"q":"身分識別基礎結構的哪個要素負責定義使用者對網路上資源的存取層級？","opts":["管理","認證","授權","稽核"],"ans":2,"exp":"授權負責判斷已驗證使用者的存取權層級。管理負責管理使用者帳戶。驗證負責識別使用者是誰。稽核負責追蹤資源的驗證、授權、管理和存取方式。","key":"","cat":"SC-900"},{"q":"與其他驗證方法相較之下，單一登入 (SSO) 的優點為何？","opts":["使用者可以存取其網域中的資源。","使用者只要驗證一次，就能在任何位置存取資源。","裝置可以由多個使用者共用。","裝置只能由單一使用者使用。"],"ans":1,"exp":"使用者只要驗證一次，就能在任何位置使用 SSO 來存取資源。存取其網域中資源的使用者會針對單一網域使用基本驗證，而不是 SSO。使用者仍然需要經過驗證才能共用裝置。","key":"","cat":"SC-900"},{"q":"同盟的特性為何？","opts":["同盟必須是雲端式。","聯邦能夠實現跨組織的服務存取。","信任一律是雙向。","使用者必須在其他網域中維護不同的使用者名稱。"],"ans":1,"exp":"聯邦能夠實現跨組織的服務存取。身分識別提供者可以是內部部署、信任不一定是雙向，而且使用者不需要在其他網域中維護不同的使用者名稱。","key":"","cat":"SC-900"},{"q":"您可以在何處找到 Microsoft 安全性、隱私權和合規性作法的相關資訊、工具和其他資源？","opts":["Azure 入口網站","Microsoft Defender 入口網站","Microsoft 服務信任入口網站","Microsoft 365 系統管理中心"],"ans":2,"exp":"服務信任入口網站是您可以找到安全性和隱私權資訊、工具和資源的位置。Azure 入口網站用來管理 Azure 資源。Microsoft 365 Defender 管理平台是您管理 Microsoft Defender 的地方。","key":"","cat":"SC-900"},{"q":"Microsoft Purview 合規性管理員中所使用的三種控制項類型為何？","opts":["Microsoft 受控控制項、協力廠商受控控制項和客戶受控控制項","Microsoft 受控控制項、共用控制項和客戶受控控制項","協力廠商控制項、共用控制項和政府控制項","政府控制項、客戶受控控制項和共用控制項"],"ans":1,"exp":"合規性管理員使用 Microsoft 受控控制項、共用控制項，以及客戶控制項。其不使用協力廠商控制項或政府控制項。","key":"","cat":"SC-900"},{"q":"合規性管理器中的合規性分數測量什麼？","opts":["組織部署安全性措施的功能","組織實作控制項的進度","組織評估控制措施的能力","組織建立控制項的進度"],"ans":1,"exp":"合規性管理員中的合規性分數會測量組織實作控制項的進度。","key":"","cat":"SC-900"},{"q":"您擁有一個 Microsoft 365 E5 訂用帳戶。你需要取得公司所需的通訊合規解決方案。您應該使用什麼？","opts":["Microsoft 365 系統管理中心","Microsoft Defender 入口網站","Microsoft Entra 系統管理中心","Microsoft Purview 入口網站"],"ans":3,"exp":"Microsoft Purview 入口網站是存取合規與風險解決方案的集中介面，如合規管理軟體、電子發現、稽核、通訊合規、資料遺失防止及內部風險管理。Microsoft Defender 入口網站用於安全作業與威脅防護。Microsoft Entra 管理中心用於身份與存取管理。Microsoft 365 管理中心負責管理租戶層級的設定與服務，但並非專門的合規解決方案入口網站。","key":"","cat":"SC-900"},{"q":"在 Microsoft Purview 中，您可以使用什麼項目來將項目標示為法規記錄、維護項目刪除證明，以及匯出已處置項目的相關資訊？","opts":["保留標籤和保留標籤原則","保留原則","敏感性標籤和敏感性標籤策略","資料外洩防護 (DLP) 原則"],"ans":0,"exp":"這些是記錄管理的功能。敏感度標籤可讓我們標示項目。Azure 原則無法用來處理文件。DLP 不會處理項目的處置。","key":"","cat":"SC-900"},{"q":"您可以使用什麼項目來防止意外洩漏在 Microsoft Teams 中共用的敏感性資訊？","opts":["適用於雲端的 Microsoft Defender","Microsoft Sentinel 活頁簿","Microsoft Purview 資料外洩防護 (DLP) 原則","適用於 Office 365 的 Microsoft Defender 安全連結"],"ans":2,"exp":"DLP 是保護敏感性資訊並防止其意外洩漏的方式。","key":"","cat":"SC-900"},{"q":"你需要為公司中特定使用者保留信箱和檔案資料五年。您應該使用什麼？","opts":["Microsoft Defender for Cloud Apps (Microsoft 雲端應用程式防護)","Microsoft Priva","Microsoft Purview 資料生命週期管理","Microsoft Purview 資料遺失防護（DLP）"],"ans":2,"exp":"資料生命週期管理提供保留政策與保留標籤，確保信箱與檔案資料在指定期間內被保留，並依組織需求刪除，直接支援紀錄管理。Defender for Cloud Apps 監控並控制雲端應用程式的使用，但不管理資料保留。Microsoft Priva 著重於隱私風險管理與主體權利申請，而非保留。DLP 防止資料過度分享，但無法控制內容保留的時間長短。","key":"","cat":"SC-900"},{"q":"您應該使用哪種類型的身分識別來允許 Azure 虛擬機器存取 Azure 儲存體，而不需要手動處理密碼變更？","opts":["使用者","裝置","服務主體","受控識別"],"ans":3,"exp":"受控識別完全由 Microsoft Entra 管理，Azure 資源在存取其他 Azure 資源時可以使用受控識別。使用者需要手動管理密碼。裝置適用於設備，但無法用來存取 Azure 資源。服務主體用於應用程式，但不適用於 Azure 資源。","key":"","cat":"SC-900"},{"q":"登入期間，Microsoft Entra 中提供了哪兩種身分驗證方法？每個正確答案都提供完整的解決方案。","opts":["密碼","簡訊型驗證","安全性問題","駕照","呼叫 Microsoft Helpdesk"],"ans":[0,1],"exp":"密碼是最常見的身分驗證形式，在 Microsoft Entra 中受支援。簡訊可以用作主要驗證形式。Google Authenticator 應用程式可用做登入任何 Microsoft Entra 帳戶的主要身分驗證形式。在 Microsoft Entra 中，呼叫 Microsoft 技術支援中心不是有效的身分驗證方法。在登入期間，不會使用安全性問題。","key":"","cat":"SC-900"},{"q":"惡意使用者正在嘗試使用常用的密碼來存取許多使用者帳戶。使用者每 20 分鐘會重複一次動作，以避免觸發帳戶鎖定。哪一項 Microsoft Entra 功能可以保護組織免受此類攻擊？","opts":["Windows Hello 企業版","自助式密碼重設 (SSPR)","條件式存取","Microsoft Entra 密碼保護"],"ans":3,"exp":"Microsoft Entra 密碼保護可協助您防範密碼噴灑攻擊。條件式存取會將訊號整合以制定決策，並強制執行組織原則，但無法自行停止密碼攻擊。SSPR 允許使用者在沒有管理員或技術支援中心參與的情況下更改或重置其密碼，但無法防止密碼攻擊。Windows Hello 企業版會以強式雙因素驗證取代裝置上的密碼。","key":"","cat":"SC-900"},{"q":"您應該在 Microsoft Entra 中使用何種功能，為使用者提供執行管理任務的能力？","opts":["應用程式註冊","外部身分識別","群組","角色"],"ans":3,"exp":"Microsoft Entra 中的角色有權執行某些管理任務。您可以將這些角色指派給使用者。","key":"","cat":"SC-900"},{"q":"您可以使用哪個功能，以根據使用者的城市屬性來指派具有資源存取權的使用者？","opts":["Microsoft Entra 權限身分識別管理","動態群組","Microsoft Entra 內建角色","Azure 內建角色"],"ans":1,"exp":"動態群組會根據 user 屬性（例如 city）來自動決定其成員資格。Microsoft Entra 中沒有角色具有動態成員身分。PIM 可讓您根據權限來強制驗證。","key":"","cat":"SC-900"},{"q":"Microsoft Entra ID 保護中的使用者風險是什麼？","opts":["認證外洩","非慣用移動","密碼噴灑","匿名 IP 位址"],"ans":0,"exp":"認證外洩是使用者風險。非慣用移動、匿名 IP 位址和密碼噴灑是登入風險。","key":"","cat":"SC-900"},{"q":"哪個服務可以協助減輕遭入侵使用者帳戶的影響？","opts":["適用於雲端的 Microsoft Defender","條件式存取","Microsoft Entra 特殊許可權身分識別管理","Microsoft Entra 身分識別保護"],"ans":3,"exp":"Azure Identity Protection 是一種工具，可讓組織利用安全性訊號來識別潛在威脅。Microsoft Defender 只能保護端點，無法幫助緩解此特定任務。雖然條件式存取對於改善組織安全性十分有用，但無法協助減輕此特定工作。Microsoft Entra Identity Protection 是一項服務，可用於管理、控制和監視對組織中重要資源的存取。","key":"","cat":"SC-900"},{"q":"你有一個 Microsoft Entra 租戶。你需要建立一個存取套件。您應該使用什麼？","opts":["適用於身分識別的 Microsoft Defender","Microsoft Entra 存取審查","Microsoft Entra ID 控管","Microsoft Entra 身分識別保護"],"ans":2,"exp":"Microsoft Entra ID 治理提供身份生命週期管理、存取審查、權限管理及存取套件。身份保護專注於偵測並回應身份風險。存取審查是一種身份治理功能，允許企業定期檢視和管理使用者對資源（如群組、應用程式和角色）的存取，確保合規與安全性。Defender for Identity 偵測的是基於身份的威脅，而非管理存取治理。","key":"","cat":"SC-900"},{"q":"哪個 Azure 功能提供網路層級篩選、應用程式層級篩選和輸出 SNAT？","opts":["分散式阻斷服務 (DDoS) 保護","Azure 防火牆","Azure Web 應用程式防火牆 (WAF)","Azure Bastion 主機服務器"],"ans":1,"exp":"Azure 防火牆提供所有這些功能。DDoS 保護不提供篩選。Azure WAF 不提供網路篩選，只提供應用程式層級篩選。Bastion 不提供篩選。","key":"","cat":"SC-900"},{"q":"在 Azure 中，您具有下列輸入網路安全性群組 (NSG) 安全性規則：優先順序為 65000 的 AllowVNetInBound、優先順序為 65001 的 AllowAzureLoadBalancerInBound、優先順序為 65500 的 DenyAllInBound。未定義 NSG 的其他輸入規則。規則的處理順序為何？","opts":["先處理 AllowVNetInBound 規則。其次處理 AllowAzureLoadBalancerInBound 規則。NSG 中將處理的最後一個規則是 DenyAllInBound 規則。","首先處理 DenyAllInBound 規則。其次處理 AllowAzureLoadBalancerInBound 規則。NSG 中將處理的最後一個規則是 AllowVNetInBound 規則。","首先處理 AllowAzureLoadBalancerInBound 規則。其次處理 AllowVNetInBound 規則。NSG 中將處理的最後一個規則是 DenyAllInBound 規則。","DenyAllInBound 規則會被優先處理。其次處理 AllowVNetInBound 規則。NSG 中將處理的最後一個規則是 AllowVNetInBound 規則。"],"ans":0,"exp":"最低優先順序值一律具有優先順序。","key":"","cat":"SC-900"},{"q":"Azure 安全性基準中使用哪兩個產業架構？每個正確答案都提供完整的解決方案。","opts":["網際網路安全中心 (CIS)","聯邦資訊處理標準 (FIPS) 140","開放 Web 應用程式安全性專案 (OWASP)","國家標準與技術局 (NIST)"],"ans":[0,3],"exp":"CIS 是使用的主要業界標準。NIST 是 ASB 中所使用的另一個標準。FIPS 140 是硬體安全性模組的標準。OWASP 是 Web 應用程式防火牆 (WAF) 標準。","key":"","cat":"SC-900"},{"q":"你可以用什麼來設定安全政策、標準和建議？","opts":["適用於雲端的 Microsoft Defender","Microsoft Defender for Cloud Apps (Microsoft 雲端應用程式防護)","適用於端點的 Microsoft Defender","適用於身分識別的 Microsoft Defender"],"ans":0,"exp":"你可以在雲端基礎架構中配置安全政策、標準和建議。Defender for Cloud 能管理法規遵循、安全標準及客製化建議。","key":"","cat":"SC-900"},{"q":"安全性資訊和事件管理 (SIEM) 解決方案的兩個特性為何？每個正確答案都提供完整的解決方案。","opts":["從 IT 環境收集資料","資料相互關聯","動作驅動工作流程","問題緩解"],"ans":[0,1],"exp":"從 IT 資產收集資料以及資料相互關聯是 SIEM 系統的一部分。","key":"","cat":"SC-900"},{"q":"哪兩種類型的安全性系統組成 Microsoft Sentinel？每個正確答案都代表解決方案的一部分。","opts":["資料外洩防護 (DLP)","安全性資訊與事件管理 (SIEM)","安全性編排自動化回應 (SOAR)","端點保護平台 (EPP)"],"ans":[1,2],"exp":"Microsoft Sentinel 是 SIEM 與 SOAR 系統的混合。","key":"","cat":"SC-900"},{"q":"您可以使用什麼工具來匯總安全性警報為事件，以建立自動化回應？","opts":["Microsoft Sentinel","適用於雲端的 Microsoft Defender","Microsoft Intune","Microsoft Defender XDR"],"ans":0,"exp":"使用 Microsoft Sentinel，可以完成將安全性警示彙整到事件中並自動回應安全性警示。除非 Microsoft for Cloud 和 Microsoft 365 Defender 連線至 Microsoft Sentinel，否則其無法協助您管理網路事件。Intune 無法協助您管理網路事件。","key":"","cat":"SC-900"},{"q":"您可以在 Microsoft Sentinel 中使用什麼項目來建立視覺效果報表？","opts":["工作簿","分析","操作手冊","搜捕"],"ans":0,"exp":"您可以使用 Microsoft Sentinel 與 Azure Monitor 活頁簿的整合來監控資料。Microsoft Sentinel 使用分析將警示與事件相互關聯。工作手冊是在偵測到警示或事件時，可從 Microsoft Sentinel 執行的一系列程序。Hunting 是根據 MITRE 架構的搜尋與查詢工具。","key":"","cat":"SC-900"},{"q":"請選擇能正確完成句子的答案。在 Microsoft Sentinel 中，事件是一組相關的 [答案選擇]。","opts":["警報","工作簿","安全任務","搜捕查詢"],"ans":0,"exp":"Microsoft Sentinel 使用分析將警示與事件相互關聯。事件是由相關警示組成的群組，這些群組共同創建了一個可操作的潛在威脅，便於您調查並解決。","key":"","cat":"SC-900"},{"q":"適用於雲端應用程式的 Microsoft Defender 中的哪個功能用來從活動記錄中擷取資料？","opts":["Cloud Discovery","應用程式連接器","政策","雲端應用程式目錄"],"ans":1,"exp":"連接器會從應用程式和其活動記錄中擷取資料。原則會偵測有風險的行為、違規和可疑的資料點。雲端應用程式目錄用來批准或取消批准應用程式。Cloud Discovery 用來識別組織所使用的雲端環境和應用程式。","key":"","cat":"SC-900"},{"q":"Microsoft 安全分數會針對哪兩個服務提供建議？每個正確答案都提供完整的解決方案。","opts":["Microsoft Entra","Microsoft Teams","Azure SQL Database","Azure Cosmos DB"],"ans":[0,1],"exp":"Microsoft 安全分數支援對 Microsoft 365（包括 Exchange Online）、Microsoft Entra、Microsoft Defender for Endpoint、Defender for Identity、Defender Cloud Apps，以及 Teams 的建議。","key":"","cat":"SC-900"},{"q":"哪款 Microsoft Defender XDR 解決方案能防範惡意電子郵件威脅？","opts":["適用於 Office 365 的 Microsoft Defender","Microsoft Defender 端點版","適用於身分識別的 Microsoft Defender","Microsoft Defender for Cloud Apps (Microsoft 雲端應用程式防護)"],"ans":0,"exp":"適用於 Office 365 的 Defender 可保護您的組織免於電子郵件訊息、連結 (URL) 和共同作業工具（包含 Microsoft Teams、SharePoint Online、商務用 OneDrive 和其他 Office 用戶端）造成的惡意威脅。","key":"","cat":"SC-900"},{"q":"哪個 Microsoft 解決方案可讓您符合一般資料保護規定 (GDPR) 和支付卡產業 (PCI) 的合規性標準？","opts":["Microsoft Defender for Cloud Apps (Microsoft 雲端應用程式防護)","適用於身分識別的 Microsoft Defender","適用於雲端的 Microsoft Defender","適用於 Office 365 的 Microsoft Defender"],"ans":0,"exp":"適用於雲端應用程式的 Defender 是一種雲端存取安全性代理程式 (CASB)，其支援各種部署模式，包括記錄收集、API 連接器和反向 Proxy。其可讓您符合 GDPR 和 PCI 的合規性標準。","key":"","cat":"SC-900"},{"q":"雲端存取安全性代理程式 (CASB) 的四個要素為何？","opts":["控制、合規性、平台安全性和治理","探索、保護、可存取的雲端應用程式和平台安全性","可見度、合規性、資料安全性和平台安全性","可見度、合規性、資料安全性和威脅防護"],"ans":3,"exp":"可見度、合規性、資料安全性和威脅防護是 CASB 的四個 exp":"虛擬網路是 Azure 網路分割的核心元件。","key":"","cat":"SC-900"},{"q":"Microsoft 安全分數會針對哪兩個服務提供建議？","opts":["Microsoft Entra","Microsoft Teams","Azure SQL Database","Azure Cosmos DB"],"ans":[0,1],"exp":"Microsoft 安全分數包含對 Microsoft Entra 與 Teams 的安全性建議。","key":"","cat":"SC-900"},{"q":"使用 Microsoft Defender XDR 會保護哪三個元件？每個正確答案都會提供一套完整的解決方案。","opts":["身分識別","端點","應用程式","分析","行動裝置"],"ans":[0,1,2],"exp":"Microsoft 365 Defender 套件使用適用於身分識別的 Microsoft Defender 和 Microsoft Entra Identity Protection 保護身分、使用適用於端點的 Microsoft Defender 保護端點、使用 Microsoft Defender for Cloud Apps 保護應用程式，以及使用適用於 Office 365 的 Microsoft Defender 保護電子郵件和共同作業。","key":"","cat":"SC-900"},{"q":"哪種驗證方法可以使用限時單次密碼？","opts":["Windows Hello","OATH 硬體令牌","強式密碼","密碼雜湊同步"],"ans":1,"exp":"OATH 硬體令牌使用基於時間的一次性密碼。強式密碼不是一次性密碼。密碼雜湊同步可在 Active Directory 和 Microsoft Entra 使用者之間同步處理雜湊。Windows Hello 使用相機或密碼來進行驗證。","key":"","cat":"SC-900"},{"q":"Microsoft Entra ID 中還提供哪兩種額外的身份驗證方式，可用於從任何裝置進行多重驗證（MFA）？每個正確答案都提供完整的解決方案。","opts":["Microsoft Authenticator 應用程式","通行密鑰 (FIDO2)","臉部辨識","指紋辨識"],"ans":[0,1],"exp":"Microsoft Authenticator 應用程式和 FIDO2 安全密鑰可在 Microsoft Entra for MFA 中從任何裝置使用。臉部和指紋辨識僅適用於具有 Windows Hello 的 Windows 裝置。","key":"","cat":"SC-900"},{"q":"哪三個功能可降低惡意使用者存取敏感性資源或授權使用者不小心影響敏感性資源的機會？每個正確答案都代表一套完整的解決方案。","opts":["適用於雲端的 Microsoft Defender","Microsoft Entra 身分識別保護","Microsoft Entra 特殊許可權身分識別管理 (PIM)","Microsoft Sentinel","角色型存取控制 (RBAC)"],"ans":[1,2,4],"exp":"Identity Protection、PIM 與 RBAC 可分別提供風險偵測、特權帳號管理及最小權限存取控制。","key":"","cat":"SC-900"}];
let session=[], idx=0, answers=[], locked=[], wrongFlags=[];

function shuffle(arr){
  let a=[...arr];
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function prepare(items){
  session=items.map(x=>JSON.parse(JSON.stringify(x)));
  // Shuffle answer choices each session and recalculate correct index.
  session.forEach(x=>{
    let pairs=x.opts.map((v,i)=>({v,i}));
    pairs=shuffle(pairs);
    x.opts=pairs.map(p=>p.v);
    if(Array.isArray(x.ans)){
      x.ans=x.ans.map(oldIdx=>pairs.findIndex(p=>p.i===oldIdx)).sort((a,b)=>a-b);
    }else{
      x.ans=pairs.findIndex(p=>p.i===x.ans);
    }
  });
  idx=0;
  answers=Array(session.length).fill(null).map((_,i)=>Array.isArray(session[i].ans)?[]:null);
  locked=Array(session.length).fill(false);
  wrongFlags=Array(session.length).fill(false);
  home.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');
  render();
}

function isMultiAnswer(x){
  return Array.isArray(x.ans);
}

function isChoiceSelected(answer, choiceIndex){
  if(Array.isArray(answer)) return answer.includes(choiceIndex);
  return answer===choiceIndex;
}

function sameAnswerSet(a,b){
  if(Array.isArray(a)!==Array.isArray(b)) return false;
  if(Array.isArray(a)){
    if(a.length!==b.length) return false;
    let aa=[...a].sort((x,y)=>x-y);
    let bb=[...b].sort((x,y)=>x-y);
    return aa.every((v,i)=>v===bb[i]);
  }
  return a===b;
}

function formatAnswerText(x){
  let indexes=Array.isArray(x.ans)?x.ans:[x.ans];
  return indexes.map(i=>String.fromCharCode(65+i)+'. '+x.opts[i]).join('；');
}

function startAll(){prepare(BANK)}
function startRandom40(){prepare(shuffle(BANK).slice(0,Math.min(40,BANK.length)))}
function startCategory(c){prepare(BANK.filter(x=>x.cat===c))}
function startWrongOnly(){
  let ids=JSON.parse(localStorage.getItem('sc900_wrong_ids')||'[]');
  let items=ids.map(i=>BANK[i]).filter(Boolean);
  if(!items.length){alert('目前沒有儲存的錯題紀錄。先做一輪題目吧！');return}
  prepare(items);
}

function render(){
  let x=session[idx];
  progressTxt.textContent=(idx+1)+' / '+session.length;
  num.textContent='第 '+(idx+1)+' / '+session.length+' 題';
  cat.textContent=x.cat+(isMultiAnswer(x)?'｜多選題':'');
  question.textContent=x.q;
  options.innerHTML='';
  x.opts.forEach((v,j)=>{
    let d=document.createElement('div');
    let selected=isChoiceSelected(answers[idx],j);
    let isCorrect=Array.isArray(x.ans)?x.ans.includes(j):j===x.ans;
    let cls='option'+(selected?' selected':'');
    if(locked[idx]&&isCorrect) cls+=' correct';
    if(locked[idx]&&selected&&!isCorrect) cls+=' wrong';
    d.className=cls;
    d.innerHTML='<span class="letter">'+String.fromCharCode(65+j)+'.</span><span>'+v+'</span>';
    d.onclick=()=>{
      if(locked[idx])return;
      if(Array.isArray(x.ans)){
        let cur=answers[idx];
        if(!Array.isArray(cur)) cur=[];
        if(cur.includes(j)) cur=cur.filter(v=>v!==j);
        else cur=[...cur,j].sort((a,b)=>a-b);
        answers[idx]=cur;
      }else{
        answers[idx]=j;
      }
      render();
    };
    options.appendChild(d);
  });
  checkBtn.classList.toggle('hidden',locked[idx]);
  nextBtn.classList.toggle('hidden',!locked[idx]);
  feedback.className='hidden';
  feedback.innerHTML='';
  if(locked[idx]) showFeedback();
  drawGrid();
}

function checkAnswer(){
  let currentAnswer=answers[idx];
  if(Array.isArray(session[idx].ans)){
    if(!Array.isArray(currentAnswer)||currentAnswer.length===0){alert('請先選擇至少一個答案');return}
  }else if(currentAnswer===null){
    alert('請先選擇答案');
    return;
  }
  locked[idx]=true;
  wrongFlags[idx]=!sameAnswerSet(answers[idx],session[idx].ans);
  render();
}

function showFeedback(){
  let x=session[idx], ok=!wrongFlags[idx];
  feedback.className='feedback '+(ok?'good':'bad');
  let ans=formatAnswerText(x);
  feedback.innerHTML='<b>'+(ok?'✅ 答對':'❌ 答錯｜正確答案：'+ans)+'</b>'+
    (x.exp?'<div style="margin-top:8px">'+x.exp+'</div>':'')+
    (x.key?'<div class="key">記憶關鍵：'+x.key+'</div>':'');
}

function nextQ(){if(idx<session.length-1){idx++;render()}else finish()}
function prevQ(){if(idx>0){idx--;render()}}

function drawGrid(){
  grid.innerHTML='';
  session.forEach((_,j)=>{
    let b=document.createElement('button');
    b.className='nav '+(locked[j]?'done ':'')+(wrongFlags[j]?'wrong':'');
    b.textContent=j+1;
    b.onclick=()=>{idx=j;render()};
    grid.appendChild(b);
  });
}

function finish(){
  let score=session.reduce((n,x,j)=>n+(sameAnswerSet(answers[j],x.ans)?1:0),0);
  // Save wrong questions by matching question text back to BANK.
  let wrongIds=[];
  session.forEach((x,j)=>{
    if(!sameAnswerSet(answers[j],x.ans)){
      let id=BANK.findIndex(b=>b.q===x.q);
      if(id>=0) wrongIds.push(id);
    }
  });
  localStorage.setItem('sc900_wrong_ids',JSON.stringify(wrongIds));
  quiz.classList.add('hidden');result.classList.remove('hidden');
  progressTxt.textContent='完成';
  result.innerHTML='<h1>完成</h1><div class="score">'+score+' / '+session.length+'</div>'+
    '<h2>正確率 '+Math.round(score/session.length*100)+'%</h2>'+
    '<p>錯題共 '+wrongIds.length+' 題，已儲存在瀏覽器中，可回首頁按「複習上次錯題」。</p>'+
    '<div class="buttons"><button class="primary" onclick="goHome()">回首頁</button><button class="secondary" onclick="prepare(session)">再做一次本組</button></div>';
}

function goHome(){
  quiz.classList.add('hidden');result.classList.add('hidden');home.classList.remove('hidden');
  progressTxt.textContent=BANK.length+' 題';
}

function doSearch(){
  let s=search.value.trim().toLowerCase();
  if(!s){searchResults.innerHTML='';return}
  let rows=BANK.map((x,i)=>({x,i})).filter(o=>
    (o.x.q+' '+o.x.opts.join(' ')+' '+(o.x.exp||'')+' '+(o.x.key||'')).toLowerCase().includes(s)
  ).slice(0,30);
  searchResults.innerHTML=rows.length?rows.map(o=>
    '<div class="searchItem" onclick="openOne('+o.i+')"><b>'+o.x.cat+'</b><br>'+o.x.q+'<div class="small">點一下單題練習</div></div>'
  ).join(''):'<div class="small">找不到符合的題目</div>';
}

function openOne(i){prepare([BANK[i]])}
</script>
